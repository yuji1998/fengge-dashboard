<script>
(function(){
  var app=document.getElementById('app');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function cls(v){if(v===null||v===undefined||isNaN(v))return 'flat';return v>0?'pos':(v<0?'neg':'flat');}
  function fmtPct(v,unit){if(v===null||v===undefined||isNaN(v))return '--';return (v>0?'+':'')+Number(v).toFixed(2)+(unit||'%');}
  function fmtPrice(v,unit){if(v===null||v===undefined||isNaN(v))return '--';var dec=Math.abs(v)<0.1?4:2;return Number(v).toFixed(dec)+(unit||'');}
  var html='';
  DATA.groups.forEach(function(g){
    html+='<div class="section"><h2 class="section-title">'+esc(g.title)+(g.sub?'<small>'+esc(g.sub)+'</small>':'')+'</h2>';
    html+='<div class="cards-row">';
    g.cards.forEach(function(c){
      var u=c.pct_unit||'%';
      html+='<div class="card"><div class="name" title="'+esc(c.name)+'">'+esc(c.name)+'</div>'+
        '<div class="price">'+fmtPrice(c.price,c.unit||'')+'</div>'+
        '<div class="cmp"><span>比昨天</span><b class="'+cls(c.d1)+'">'+fmtPct(c.d1,u)+'</b></div>'+
        '<div class="cmp"><span>比月初</span><b class="'+cls(c.mtd)+'">'+fmtPct(c.mtd,u)+'</b></div>'+
        '<div class="cmp"><span>比年初</span><b class="'+cls(c.ytd)+'">'+fmtPct(c.ytd,u)+'</b></div>'+
        '</div>';
    });
    html+='</div>';
    if(g.chart){
      var ch=DATA.charts[g.chart];
      if(ch){
        html+='<div class="chart-container"><div class="chart-head"><strong>'+esc(ch.title)+'</strong><em>'+esc(ch.sub||'')+'</em></div>'+
          '<div id="'+g.chart+'" class="chart"></div>'+
          '<div class="chart-note">'+ch.note+'</div></div>';
      }
    }
    html+='</div>';
  });
  app.innerHTML=html;

  var note='<b>口径与来源</b><ul>';
  DATA.notes.forEach(function(n){note+='<li>'+n+'</li>';});
  note+='</ul>';
  document.getElementById('footnote').innerHTML=note;
})();
</script>

<script>

      series:series
    };

      var firstDate=ch.series[0].data[0][0];
