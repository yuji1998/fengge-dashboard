<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专题学习</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f2f4f8; color:#2b3445; line-height:1.7; font-size:16px; min-height:100vh; }
.hero { background:linear-gradient(135deg,#0d2b52 0%,#14417e 55%,#1b5aa8 100%); color:#fff;
  padding:38px 20px 40px; text-align:center; }
.hero .tag { display:inline-block; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35);
  border-radius:999px; padding:3px 14px; font-size:13px; letter-spacing:1px; margin-bottom:12px; }
.hero h1 { font-size:24px; font-weight:700; }
.hero .sub { margin-top:8px; font-size:13.5px; opacity:.85; }
.wrap { max-width:680px; margin:0 auto; padding:0 14px 60px; }
.tip { text-align:center; color:#8a94a6; font-size:12.5px; margin-top:14px; }
.topic-card { display:flex; align-items:center; background:#fff; border-radius:14px;
  padding:18px 16px; margin-top:14px; box-shadow:0 2px 12px rgba(13,43,82,.08);
  text-decoration:none; color:inherit; transition:transform .12s; }
.topic-card:active { transform:scale(.98); }
.topic-emoji { font-size:34px; margin-right:16px; flex:none; }
.topic-info { flex:1; min-width:0; }
.topic-title { font-size:16.5px; font-weight:600; color:#0d2b52; }
.topic-desc { font-size:13px; color:#68738a; margin-top:3px; }
.topic-date { font-size:11.5px; color:#9aa4b8; margin-top:4px; }
.topic-arrow { color:#c3ccdb; font-size:20px; margin-left:8px; flex:none; }
.empty { text-align:center; color:#8a94a6; padding:50px 0; }
.err { background:#fdf0ef; color:#7b241c; border-radius:10px; padding:14px 16px; margin-top:16px; font-size:14px; }
</style>
</head>
<body>
<div class="hero">
  <div class="tag">F:\专题 · 随身版</div>
  <h1>📚 专题学习</h1>
  <div class="sub">新专题在本地 topics.json 登记，push 后自动出现在这里</div>
</div>
<div class="wrap">
  <div id="list"><div class="empty">加载中…</div></div>
  <div class="tip" id="syncTip"></div>
</div>
<script>
(function(){
  var listEl = document.getElementById('list');
  // 时间戳防缓存：每次打开都拉最新 topics.json
  fetch('topics.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){
      var items = data.topics || [];
      if(!items.length){ listEl.innerHTML = '<div class="empty">暂无专题</div>'; return; }
      listEl.innerHTML = items.map(function(t){
        return '<a class="topic-card" href="' + t.url + '?v=' + (t.ts || data.updated) + '">'
          + '<div class="topic-emoji">' + (t.emoji || '📄') + '</div>'
          + '<div class="topic-info">'
          + '<div class="topic-title">' + t.title + '</div>'
          + (t.desc ? '<div class="topic-desc">' + t.desc + '</div>' : '')
          + (t.date ? '<div class="topic-date">更新于 ' + t.date + '</div>' : '')
          + '</div><div class="topic-arrow">›</div></a>';
      }).join('');
      document.getElementById('syncTip').textContent = '清单版本：' + data.updated + ' · 本地更新 push 后手机即见最新';
    })
    .catch(function(e){
      listEl.innerHTML = '<div class="err">专题清单加载失败（' + e.message + '）。请检查网络后下拉重试。</div>';
    });
})();
</script>
</body>
</html>
