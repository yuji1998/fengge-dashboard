// 复制邀请内容（navigator.clipboard + textarea 降级）
function copyInvite(){
  if(!VISITOR_INVITE) return;
  var v = VISITOR_INVITE;
  var txt = '【访客邀请】邀请码：' + v.code + '｜被访人：' + v.host +
            '｜来访时间：' + v.visit + '｜有效期至：' + v.valid + '｜凭此码于门卫处核验通行。';
  var done = function(){ toast('邀请内容已复制，可发送给访客'); };
  // 降级通道：无 clipboard API 时用 textarea + execCommand
  var fallback = function(){
    try{
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){ toast('复制失败，请手动长按复制邀请码 ' + v.code); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else {
    fallback();
  }
}

// ============ P3-⑥：用户授权配置（角色权限矩阵）============
const AUTH_ROLES = ['普通员工', '部门主管', '管理员', '访客'];
const AUTH_ROLE_COLOR = { '普通员工': '#1E5AA8', '部门主管': '#B45309', '管理员': '#C7000B', '访客': '#6D4AA8' };
// 行=功能模块，1=有权限 0=无权限
const AUTH_MATRIX = [
  { mod: '餐饮服务 · 餐单查询',      p: [1, 1, 1, 0] },
  { mod: '餐饮服务 · 在线订餐',      p: [1, 1, 1, 0] },
  { mod: '生活预约 · 场馆预约',      p: [1, 1, 1, 0] },
  { mod: '门禁访客 · 访客预登记',    p: [1, 1, 1, 1] },
  { mod: '门禁访客 · 审批与放行',    p: [0, 1, 1, 0] },
  { mod: '办公保障 · 用车/接待申请', p: [1, 1, 1, 0] },
  { mod: '办公保障 · 维修工单受理',  p: [0, 1, 1, 0] },
  { mod: '平台管理 · 数据统计看板',  p: [0, 1, 1, 0] },
  { mod: '平台管理 · 信息精准推送',  p: [0, 0, 1, 0] },
  { mod: '平台管理 · 用户授权配置',  p: [0, 0, 1, 0] }
];

function renderMgmtAuthConfig(screen){
  renderNav({title:'用户授权配置', back:true, icbc:true});
  var h = '<div class="wrap">';
  h += '<div class="tip info"><span class="ti">ℹ️</span><div>按角色配置各功能模块的可见与操作权限，支持批量导入 CSV 维护矩阵。</div></div>';

  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px">' +
    '<div style="font-size:12.5px;color:#8A8A8A">共 ' + AUTH_MATRIX.length + ' 个功能模块 · ' + AUTH_ROLES.length + ' 类角色</div>' +
    '<button onclick="importAuthCsv()" style="padding:6px 14px;border:0;background:#C7000B;color:#fff;border-radius:15px;' +
    'font-size:12px;cursor:pointer;font-family:inherit">批量导入</button></div>';

  // 权限矩阵表格
  h += '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table style="width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;font-size:12px">';
  h += '<thead><tr style="background:#F7F7F9">' +
    '<th style="text-align:left;padding:10px 8px;font-weight:600;color:#333;white-space:nowrap">功能模块</th>';
  AUTH_ROLES.forEach(function(r){
    h += '<th style="padding:10px 4px;font-weight:600;color:' + AUTH_ROLE_COLOR[r] + ';white-space:nowrap;text-align:center">' + esc(r) + '</th>';
  });
  h += '</tr></thead><tbody>';
  AUTH_MATRIX.forEach(function(row, ri){
    h += '<tr style="border-top:1px solid #F0F0F0">' +
      '<td style="padding:10px 8px;color:#333;line-height:1.4">' + esc(row.mod) + '</td>';
    row.p.forEach(function(v, ci){
      var on = v === 1;
      h += '<td style="padding:10px 4px;text-align:center">' +
        '<div onclick="toggleAuth(' + ri + ',' + ci + ')" style="width:24px;height:24px;line-height:24px;margin:0 auto;border-radius:6px;cursor:pointer;' +
        'font-size:13px;font-weight:700;' + (on
          ? 'background:#0F8A5F1A;color:#0F8A5F;border:1px solid #0F8A5F40'
          : 'background:#F3F3F3;color:#C0C0C0;border:1px solid #E8E8E8') + '" title="点击切换">' +
        (on ? '✓' : '✗') + '</div></td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  h += '<div style="font-size:11.5px;color:#8A8A8A;padding:10px 4px;line-height:1.7">' +
    '说明：✓ 表示该角色具备此功能权限，✗ 表示不可见/不可操作。点击单元格可临时切换（演示效果）。<br>' +
    '批量导入：上传 CSV（功能模块,普通员工,部门主管,管理员,访客），系统按行覆盖权限配置。</div>';
  h += '</div><div class="copyright">平台管理 · 由办公室 / 物业公司负责</div>';

// P3-⑥：单元格权限切换（演示用，修改后重绘）
function toggleAuth(ri, ci){
  if(!AUTH_MATRIX[ri]) return;
  AUTH_MATRIX[ri].p[ci] = AUTH_MATRIX[ri].p[ci] === 1 ? 0 : 1;
  render();
}
// P3-⑥：批量导入（mock 提示）
function importAuthCsv(){
  toast('请上传 CSV 文件（演示：暂未接入文件选择）');
}

// ============ P3-⑦：我的申请 · 统一状态 + 审批链 + 驳回重提 ============
let APPLY_OPEN = {};      // 展开的审批链 {id: true}

// 统一状态：已提交 / 审批中 / 已通过 / 已驳回
const APPLY_STATE = {
  LABEL: { submitted: '已提交', pending: '审批中', approved: '已通过', rejected: '已驳回' },
  COLOR: { submitted: '#1E5AA8', pending: '#B45309', approved: '#0F8A5F', rejected: '#C7000B' },
  label(k){ return this.LABEL[k] || '审批中'; },
  color(k){ return this.COLOR[k] || '#1E5AA8'; },
  // 只对「申请类」记录展示审批链（订餐/评价/预约不适用）
  canChain(r){
    return r && r._kind === 'applies';
  },
  // 由原 status 归一化到四态
  keyOf(st, r){
    if(st === '已驳回' || st === '驳回') return 'rejected';
    if(st === '已通过' || st === '审批通过') return 'approved';
    if(st === '已提交') return 'submitted';
    return 'pending';
  },
  // 重提次数（驳回后重新提交会累加）
  resubmitCount(r){ return (r && r.resubmitCount) || 0; }
};

// 展开/收起审批链
function toggleApplyChain(id){
  APPLY_OPEN[id] = !APPLY_OPEN[id];
  render();
}

// 审批链节点渲染（提交人 → 部门主管 → 管理员）
function renderApplyChain(r, stKey){
  var nodes = [];
  var t0 = r.createdStr || '—';
  // 节点 1：提交人（始终已完成）
  nodes.push({
    nm: '提交人 · ' + (r.user || '本人'), st: 'done',
    meta: '提交时间 ' + t0,
    opt: (r.summary || '申请已提交')
  });
  // 节点 2：部门主管
  if(stKey === 'submitted'){
    nodes.push({ nm: '部门主管 · 待审批', st: 'wait', meta: '等待主管处理', opt: '' });
  } else if(stKey === 'pending'){
    nodes.push({ nm: '部门主管 · 审批中', st: 'doing', meta: '已转交主管，处理中', opt: '已接收，正在核验申请内容' });
  } else {
    nodes.push({ nm: '部门主管 · 已审批', st: 'done', meta: '部门主管 ' + t0.slice(0, 10),
      opt: (stKey === 'rejected' ? '材料不齐，予以驳回' : '同意，转管理员复核') });
  }
  // 节点 3：管理员
  if(stKey === 'approved'){
    nodes.push({ nm: '管理员 · 已通过', st: 'done', meta: '管理员复核通过', opt: '同意办理，请按流程执行' });
  } else if(stKey === 'rejected'){
    nodes.push({ nm: '管理员 · 已退回', st: 'rej', meta: '流程终止', opt: '驳回原因：' + (r.rejectReason || '申请信息不完整，请补充后重新提交') });
  } else {
    nodes.push({ nm: '管理员 · 待复核', st: 'wait', meta: '等待管理员复核', opt: '' });
  }
  var colorMap = { done: '#0F8A5F', doing: '#B45309', wait: '#C0C0C0', rej: '#C7000B' };
  var markMap = { done: '✓', doing: '●', wait: '○', rej: '✗' };

  var h = '<div style="padding:0 15px 12px 59px"><div class="chain">';
  nodes.forEach(function(nd){
    var c = colorMap[nd.st] || '#999';
    h += '<div class="cnode"><div class="cdot" style="background:' + c + '">' + markMap[nd.st] + '</div>' +
      '<div class="cline"></div><div class="cbody">' +
      '<div class="cnm" style="color:' + (nd.st === 'wait' ? '#999' : '#1A1A1A') + '">' + esc(nd.nm) + '</div>' +
      '<div class="cmeta">' + esc(nd.meta) + '</div>' +
      (nd.opt ? '<div class="copt">' + esc(nd.opt) + '</div>' : '') +
      '</div></div>';
  });
  h += '</div>';
  // P3-⑦：驳回的申请 -> 重新提交
  if(stKey === 'rejected'){
    h += '<button onclick="resubmitApply(\'' + r.id + '\')" style="width:100%;margin-top:2px;padding:10px;border:1px solid #C7000B;' +
      'background:#fff;color:#C7000B;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit">重新提交</button>';
  }
  h += '</div>';
  return h;
}

// P3-⑦：驳回后再提交（新开一条申请记录回到可填写状态）
function resubmitApply(id){
  var src = null;
  (STORE.list('applies') || []).forEach(function(r){ if(r.id === id) src = r; });
  if(!src){ toast('记录不存在'); return; }
  var r = STORE.add('applies', {
    pageId: src.pageId || '',
    title: src.title || '业务申请',
    cat: src.cat || '综合业务',
    summary: '【重新提交】' + (src.summary || ''),
    user: src.user, dept: src.dept, badge: src.badge,
    status: '已提交',
    resubmitCount: (src.resubmitCount || 0) + 1,
    resubmitFrom: id
  });
  // 原记录标记为已重提，避免重复操作
  src.resubmitted = true;
  STORE.save();
  APPLY_OPEN[r.id] = true;
  toast('已重新提交 · 新单号 ' + r.id);
  setTimeout(function(){ render(); }, 900);
}
