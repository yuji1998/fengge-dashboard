<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>办公室综合服务平台 · 手机端原型</title>
<style>

/* ============================================================
   办公室综合服务平台 · 手机端原型 v2
   视觉风格：中国工商银行手机银行
   ============================================================ */
:root{
  /* 工行红 */
  --icbc:#C7000B;
  --icbc-lt:#E60012;
  --icbc-dk:#A50008;
  --brand-grad:linear-gradient(160deg,#E60012 0%,#C7000B 55%,#B00009 100%);
  --text:#1A1A1A; --sub:#999; --sub2:#666; --line:#F0F0F0;
  --bg:#F4F5F7; --card:#fff;
  --radius:10px; --shadow:0 1px 6px rgba(0,0,0,.05);
  --blue:#1E5AA8; --green:#0F8A5F; --cyan:#0E7490;
  --purple:#6D4AA8; --orange:#B45309; --gold:#C9A227;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#fff;color:var(--text);display:flex;justify-content:center;
  align-items:flex-start;min-height:100vh;padding:0;
}
/* ============ 手机外壳 ============ */
#phone{
  width:100%;max-width:100%;height:100vh;min-height:100vh;background:var(--bg);border-radius:0;
  box-shadow:none;position:relative;overflow:hidden;
  border:0;display:flex;flex-direction:column;
}
/* 宽屏（电脑浏览器）下限制内容宽度并居中，避免元素被拉成横条 */
@media (min-width:560px){
  body{background:#EDEFF3;}
  #phone{max-width:480px;box-shadow:0 0 24px rgba(0,0,0,.10);}
}
#statusbar{
  height:44px;flex:0 0 44px;position:absolute;top:0;left:0;right:0;z-index:60;
  max-width:480px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  font-size:13px;font-weight:600;pointer-events:none;color:#fff;
  transition:color .2s;
}
#statusbar.dark{color:#1A1A1A;}
#statusbar .right{display:flex;gap:5px;align-items:center;font-size:11px;}

/* 导航条：工行红渐变 */
#nav{
  flex:0 0 44px;height:44px;position:relative;z-index:50;
  width:100%;max-width:480px;margin-left:auto;margin-right:auto;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:500;color:#fff;
  background:var(--brand-grad);
}
#nav.plain{background:#fff;color:#1A1A1A;border-bottom:1px solid var(--line);}
#nav .back{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  font-size:23px;cursor:pointer;font-weight:300;color:inherit;
}
#nav .more{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  font-size:17px;cursor:pointer;letter-spacing:1px;color:inherit;
}
/* P3-③：导航栏铃铛 + 未读角标 */
#nav .bell{
  position:absolute;right:52px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  font-size:17px;cursor:pointer;color:inherit;
}
#nav .bell .bdg{
  position:absolute;top:2px;right:1px;min-width:15px;height:15px;padding:0 4px;
  border-radius:8px;background:#FF3B30;color:#fff;font-size:10px;font-weight:600;
  line-height:15px;text-align:center;box-sizing:border-box;font-family:inherit;
}
/* P3-④：消息中心未读高亮 */
.msg-row{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;}
.msg-row:last-child{border-bottom:none;}
.msg-row:active{background:#FAFAFA;}
.msg-row.unread{background:#FFF7F7;border-left:3px solid #C7000B;padding-left:12px;}
.msg-row .mi{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 34px;}
.msg-row .mb{flex:1;min-width:0;}
.msg-row .mt{font-size:14px;font-weight:600;color:#1A1A1A;display:flex;align-items:center;gap:6px;}
.msg-row .ms{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.55;}
.msg-row .mtime{font-size:11px;color:#B0B0B0;margin-top:5px;}
.msg-row .dot{width:7px;height:7px;border-radius:50%;background:#C7000B;flex:0 0 7px;}
/* P3-⑦：我的申请状态标签 + 审批链 */
.chain{background:#FAFAFA;border-radius:8px;padding:12px 14px 4px;margin:2px 0 4px;}
.chain .cnode{display:flex;gap:10px;position:relative;padding-bottom:14px;}
.chain .cnode:last-child{padding-bottom:6px;}
.chain .cdot{width:16px;height:16px;border-radius:50%;flex:0 0 16px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;}
.chain .cline{position:absolute;left:7.5px;top:18px;bottom:0;width:1px;background:#E0E0E0;}
.chain .cnode:last-child .cline{display:none;}
.chain .cbody{flex:1;min-width:0;}
.chain .cnm{font-size:13px;font-weight:500;color:#1A1A1A;}
.chain .cmeta{font-size:11px;color:#999;margin-top:3px;line-height:1.5;}
.chain .copt{font-size:11.5px;color:#666;margin-top:4px;background:#F2F2F2;border-radius:4px;padding:5px 8px;line-height:1.5;}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
#screen::-webkit-scrollbar{display:none;}
#screen.hasTab{padding-bottom:0;}

/* ============ 工行红渐变头部（首页） ============ */
.icbc-hero{
  background:var(--brand-grad);color:#fff;
  padding:18px 20px 58px;position:relative;
}
.icbc-hero .row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.icbc-hero .logo{display:flex;align-items:center;gap:9px;}
.icbc-hero .logo .mark{
  width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
  border:1px solid rgba(255,255,255,.35);
}
.icbc-hero .logo .nm{font-size:15px;font-weight:600;letter-spacing:.5px;}
.icbc-hero .logo .sub{font-size:10.5px;opacity:.8;margin-top:1px;letter-spacing:.3px;}
.icbc-hero .user{display:flex;align-items:center;gap:6px;font-size:12.5px;}
.icbc-hero .user .av{
  width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:12px;
  border:1px solid rgba(255,255,255,.35);
}
.icbc-hero h1{margin:0 0 6px;font-size:21px;font-weight:600;letter-spacing:.5px;}
.icbc-hero .desc{font-size:11.5px;opacity:.85;line-height:1.5;}
.icbc-hero .chips{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap;}
.icbc-hero .chips span{
  font-size:10.5px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:10px;
  border:1px solid rgba(255,255,255,.14);
}

/* ============ 轮播广告落地页 ============ */
.ad-wrap{padding:0 0 24px;background:#F5F6F8;min-height:100%;}
.ad-hero{width:100%;display:block;background:#EDEDED;}
.ad-body{background:#fff;margin:0 14px;margin-top:-14px;border-radius:12px;
  padding:18px 16px 20px;box-shadow:0 2px 12px rgba(0,0,0,.06);position:relative;}
.ad-body h2{margin:0 0 8px;font-size:17px;color:#1A1A1A;font-weight:600;}
.ad-sub{font-size:12.5px;color:#C7000B;margin:0 0 10px;}
.ad-body p{margin:0 0 16px;font-size:13px;color:#666;line-height:1.75;white-space:pre-wrap;}
.ad-btn{width:100%;padding:12px;border:none;border-radius:9px;background:#C7000B;color:#fff;
  font-size:15px;font-family:inherit;cursor:pointer;}
.ad-btn:active{opacity:.85;}

/* ============ 金刚区（工行式功能入口） ============ */
.kingkong{
  background:#fff;border-radius:12px;margin:-44px 14px 12px;padding:16px 8px 8px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);position:relative;z-index:5;
}
.kk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 0;}
.kk{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:8px 2px 14px;cursor:pointer;transition:transform .12s;
}
.kk:active{transform:scale(.93);}
.kk .ki svg{width:24px;height:24px;display:block;}
.kk .ic{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:21px;position:relative;
}
.kk .lb{font-size:11.5px;color:#333;text-align:center;line-height:1.25;}
.kk .badge{
  position:absolute;top:-3px;right:-3px;font-size:8.5px;background:#FF8A00;color:#fff;
  padding:1px 5px;border-radius:7px;border:1.5px solid #fff;line-height:1.4;
}
/* 金刚区右上角编辑按钮 */
.kk-edit-btn{
  position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:#BBB;background:transparent;transition:color .15s,background .15s;z-index:6;
}
.kk-edit-btn svg{width:15px;height:15px;display:block;}
.kk-edit-btn:active{color:#666;background:#F2F2F2;}
/* 金刚区空状态 */
.kk-empty{padding:16px 8px 20px;text-align:center;font-size:12.5px;color:#AAA;}
/* 金刚区编辑面板 */
.kk-ed-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.kk-ed-hd .t{font-size:15.5px;font-weight:600;color:#1A1A1A;}
.kk-ed-hd .x{font-size:20px;color:#BBB;cursor:pointer;line-height:1;padding:0 4px;}
.kk-ed-sub{font-size:12px;color:#999;margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center;}
.kk-ed-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid #F0F0F0;
  border-radius:9px;margin-bottom:7px;background:#FCFCFC;
}
.kk-ed-item .ico{
  width:30px;height:30px;border-radius:50%;flex:none;display:flex;
  align-items:center;justify-content:center;
}
.kk-ed-item .ico svg{width:16px;height:16px;display:block;}
.kk-ed-item .nm{flex:1;font-size:13px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kk-ed-item .nm.bad{color:#C7000B;}
.kk-ed-item .nm.bad::after{content:' ·已失效';font-size:11px;color:#C7000B;}
.kk-ed-btns{display:flex;gap:5px;flex:none;}
.kk-ed-btns button{
  width:26px;height:26px;border:1px solid #E6E6E6;background:#fff;border-radius:6px;
  color:#555;font-size:13px;cursor:pointer;font-family:inherit;padding:0;line-height:1;
}
.kk-ed-btns button:disabled{color:#DDD;border-color:#F2F2F2;}
.kk-ed-btns button.del{color:#C7000B;border-color:#FADCDC;}
.kk-ed-tags{display:flex;flex-wrap:wrap;gap:6px;}
.kk-ed-tag{
  font-size:12px;padding:5px 10px;border-radius:20px;background:#F5F5F5;color:#555;
  cursor:pointer;border:1px solid transparent;
}
.kk-ed-tag.on{background:#EFEFEF;color:#BBB;cursor:default;}
.kk-ed-tag.add:active{background:#E8F0FA;color:#1E5AA8;border-color:#CFE0F4;}
.kk-ed-ft{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid #F2F2F2;}
.kk-ed-ft .rst{font-size:12.5px;color:#999;cursor:pointer;text-decoration:underline;}
.kk-ed-ft .ok{
  padding:9px 22px;border:none;border-radius:8px;background:#C7000B;color:#fff;
  font-size:14px;cursor:pointer;font-family:inherit;
}

/* ============ 通知栏跑马灯（首页金刚区下方） ============ */
.notice-bar{
  display:flex;align-items:center;gap:8px;
  margin:0 14px 12px;padding:0 12px;height:36px;
  background:#FFF5F5;border:1px solid #FFE3E3;border-radius:10px;
  overflow:hidden;position:relative;
}
.notice-bar .nb-ic{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:18px;height:18px;color:var(--icbc);
}
.notice-bar .nb-ic svg{width:16px;height:16px;display:block;}
.notice-bar .nb-track{
  flex:1;min-width:0;overflow:hidden;position:relative;height:100%;
}
.notice-bar .nb-txt{
  position:absolute;top:0;left:0;height:100%;
  display:flex;align-items:center;white-space:nowrap;
  font-size:12px;color:#C7000B;letter-spacing:.2px;
  will-change:transform;
  animation:nb-marquee 14s linear infinite;
}
@keyframes nb-marquee{
  0%   { transform:translateX(100%); }
  100% { transform:translateX(-100%); }
}
@keyframes nb-marquee-2{
  0%   { transform:translateX(0); }
  100% { transform:translateX(-200%); }
}
/* ============ Banner 轮播（跑马灯下方） ============ */
.banner-wrap{
  margin:0 14px 12px;position:relative;border-radius:10px;overflow:hidden;
  height:165px;box-shadow:var(--shadow);background:#F3F3F3;
}
.banner-track{
  display:flex;height:100%;
  transition:transform .45s ease;
  will-change:transform;
}
.banner-img{
  width:100%;height:100%;object-fit:cover;flex:0 0 100%;
  display:block;border:0;
}
.banner-dots{
  position:absolute;left:0;right:0;bottom:8px;
  display:flex;justify-content:center;gap:6px;
  pointer-events:none;
}
.banner-dots .dot{
  width:6px;height:6px;border-radius:3px;
  background:rgba(255,255,255,.55);
  transition:all .3s;
}
.banner-dots .dot.on{
  background:#fff;width:16px;
}

/* ============ 模块卡（首页下方） ============ */
.sect-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;margin:14px 0 9px;
}
.sect-hd .t{font-size:14.5px;font-weight:600;color:#1A1A1A;display:flex;align-items:center;gap:7px;}
.sect-hd .t i{
  display:inline-block;width:3px;height:13px;background:var(--icbc);
  border-radius:2px;font-style:normal;
}
.sect-hd .m{font-size:11.5px;color:var(--sub);}
.modlist{background:#fff;border-radius:var(--radius);margin:0 14px 12px;overflow:hidden;box-shadow:var(--shadow);}
.modrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;}
.modrow:last-child{border-bottom:none;}
.modrow:active{background:#FAFAFA;}
.modrow .mi{
  width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:20px;flex:0 0 40px;position:relative;
}
.modrow .mb{flex:1;min-width:0;}
.modrow .mt{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:6px;}
.modrow .md{font-size:11px;color:var(--sub);margin-top:3px;}
.modrow .ar{color:#CCC;font-size:16px;}

/* ============ 通用 Banner（内页） ============ */
.banner{
  margin:0 0 12px;padding:18px 20px 20px;color:#fff;position:relative;
  border-radius:0 0 16px 16px;
}
.banner h1{margin:0 0 6px;font-size:20px;font-weight:600;}
.banner p{margin:0;font-size:11.5px;opacity:.85;}

/* ============ 区块 / 卡片 ============ */
.sect-t{font-size:12.5px;color:var(--sub2);margin:15px 16px 8px;font-weight:500;}
.wrap{padding:0 14px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card{
  background:var(--card);border-radius:var(--radius);padding:15px 13px;
  cursor:pointer;position:relative;box-shadow:var(--shadow);transition:transform .12s;
}
.card:active{transform:scale(.97);}
.card .ico{
  width:44px;height:44px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;margin-bottom:10px;
  background:linear-gradient(135deg,#FFF7F6 0%,#FFECEA 100%);
  box-shadow:0 2px 8px rgba(199,0,11,.07);
  border:1px solid rgba(199,0,11,.06);
}
.card .ico svg{width:23px;height:23px;display:block;}
.card .tt{font-size:14px;font-weight:500;margin-bottom:4px;color:var(--text);}
.card .ds{font-size:11px;color:var(--sub);line-height:1.4;}

/* ============ 标签 ============ */
.tag{
  position:absolute;top:9px;right:9px;font-size:10px;padding:2px 6px;
  border-radius:7px;font-weight:500;line-height:1.45;
}
.tag.inline{position:static;display:inline-block;margin-left:5px;}
.tag.orange{background:#FFF3E6;color:#C96A00;}
.tag.green{background:#E9F6EF;color:#0F8A5F;}
.tag.blue{background:#E9F0FA;color:#1E5AA8;}
.tag.purple{background:#F0EDFA;color:#6D4AA8;}
.tag.red{background:#FDECEC;color:var(--icbc);}
.tag.gray{background:#F3F3F3;color:#999;}
.tag.gold{background:#FBF4E0;color:#9C7A0E;}

/* ============ 列表 ============ */
.list{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.row{
  display:flex;align-items:center;gap:12px;padding:13px 15px;
  border-bottom:1px solid var(--line);cursor:pointer;background:var(--card);
}
.row:last-child{border-bottom:none;}
.row:active{background:#FAFAFA;}
.row .ri{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 32px;}
.row .rb{flex:1;min-width:0;}
.row .rt{font-size:14px;font-weight:500;}
.row .rs{font-size:11px;color:var(--sub);margin-top:3px;}
.row .rr{font-size:13px;color:var(--sub);}
.row .arrow{color:#CCC;font-size:15px;}

/* ============ 表单 ============ */
.form{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;}
.fitem{display:flex;align-items:center;min-height:50px;padding:12px 15px;border-bottom:1px solid var(--line);}
.fitem:last-child{border-bottom:none;}
.flabel{width:88px;flex:0 0 88px;font-size:13.5px;color:#333;}
.flabel em{color:var(--icbc);font-style:normal;margin-right:2px;}
.fval{flex:1;font-size:13.5px;color:var(--text);text-align:right;}
.fval.ph{color:#BBB;}
.finput{flex:1;border:none;outline:none;font-size:13.5px;text-align:right;font-family:inherit;background:transparent;color:var(--text);}
.finput::placeholder{color:#BBB;}
.farrow{color:#CCC;font-size:14px;margin-left:5px;}
.stepper{display:flex;align-items:center;gap:13px;}
.stepper button{
  width:25px;height:25px;border-radius:50%;border:1px solid #DEDEDE;background:#fff;
  font-size:15px;color:#666;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;
}
.stepper button:active{background:#F2F2F2;}
.stepper span{min-width:22px;text-align:center;font-size:15px;font-weight:600;}

/* ============ 最近使用（一行 4 个） ============ */
.rec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px;}
.rec-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0;}
.rec-item:active{transform:scale(.96);}
.rec-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .2s;}
.rec-ic svg{width:24px;height:24px;display:block;}
.rec-item:active .rec-ic{transform:scale(.92);}
.rec-t{font-size:12.5px;color:#333;text-align:center;line-height:1.3;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;}

/* ============ 时段 ============ */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;}
.slot{padding:9px 4px;border-radius:8px;border:1px solid #E8E8E8;font-size:12.5px;text-align:center;cursor:pointer;background:#fff;}
.slot.on{background:var(--icbc);color:#fff;border-color:var(--icbc);font-weight:500;box-shadow:0 2px 8px rgba(199,0,11,.25);}
.slot.off{background:#F7F7F7;color:#CCC;border-color:#F2F2F2;cursor:not-allowed;}
.slot:not(.off):active{transform:scale(.96);}

/* ============ 提示条 ============ */
.tip{display:flex;gap:8px;padding:11px 13px;border-radius:9px;font-size:12px;line-height:1.55;margin-bottom:12px;background:#FFF3E6;color:#8A5A00;}
.tip.info{background:#E9F0FA;color:#1A4B85;}
.tip.green{background:#E9F6EF;color:#0A6847;}
.tip.warn{background:#FFF3E6;color:#A34400;}
.tip .ti{flex:0 0 auto;font-size:14px;}

/* ============ 按钮 ============ */
.submit{
  display:block;width:calc(100% - 28px);margin:10px 14px 16px;padding:13px;
  border:none;border-radius:8px;background:var(--brand-grad);color:#fff;
  font-size:15.5px;font-weight:500;cursor:pointer;font-family:inherit;
  box-shadow:0 3px 12px rgba(199,0,11,.28);transition:transform .12s;
}
.submit:active{transform:scale(.985);}
.submit:disabled{background:#D8D8D8;box-shadow:none;cursor:not-allowed;color:#fff;}
.submit.ghost{background:#fff;color:var(--icbc);border:1px solid var(--icbc);box-shadow:none;}

/* ============ 详情/统计 ============ */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.stat{background:#fff;border-radius:var(--radius);padding:14px 8px;text-align:center;box-shadow:var(--shadow);}
.stat .n{font-size:21px;font-weight:700;color:var(--icbc);line-height:1.2;}
.stat .l{font-size:10.5px;color:var(--sub);margin-top:4px;}
.bar-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.bar-row .bl{width:64px;font-size:12px;color:#555;flex:0 0 64px;}
.bar-row .bt{flex:1;height:7px;background:#F2F2F2;border-radius:4px;overflow:hidden;}
.bar-row .bf{height:100%;border-radius:4px;}
.bar-row .bv{width:48px;text-align:right;font-size:11.5px;color:var(--sub);flex:0 0 48px;}

/* ============ 底部 Tab 栏（工行式） ============ */
#tabbar{
  flex:0 0 54px;height:54px;display:flex;background:#fff;
  border-top:1px solid var(--line);z-index:55;
  width:100%;max-width:480px;margin:0 auto;
}
#tabbar .tb{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;font-size:10px;color:#9A9A9A;transition:color .15s;
}
#tabbar .tb .i{line-height:1;display:flex;align-items:center;justify-content:center;}
#tabbar .tb .i svg{width:23px;height:23px;display:block;}
#tabbar .tb.on{color:var(--icbc);font-weight:500;}
#tabbar .tb{position:relative;}
#tabbar .tb .bdg{
  position:absolute;top:4px;left:50%;margin-left:5px;
  min-width:15px;height:15px;padding:0 4px;box-sizing:border-box;
  background:#E4002B;color:#fff;font-size:9px;line-height:15px;
  border-radius:8px;text-align:center;font-weight:600;
  display:none;
}
#tabbar .tb .bdg.show{display:block;}

/* ============ 规格浮层 ============ */
#specbtn{
  position:absolute;right:14px;bottom:70px;z-index:80;
  /* 宽屏下跟随 #phone 居中 */
  margin-left:auto;
  width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.28);
}
#specbtn.hide{display:none;}
#spec{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none;align-items:flex-end;border-radius:31px;}
#spec.on{display:flex;}
#spec .box{background:#fff;width:100%;border-radius:16px 16px 31px 31px;padding:18px 18px 22px;max-height:76%;overflow-y:auto;}
#spec h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px;color:#1A1A1A;}
#spec .kv{display:flex;padding:7.5px 0;border-bottom:1px solid #F4F4F4;font-size:12.5px;}
#spec .kv:last-child{border-bottom:none;}
#spec .kk{width:84px;flex:0 0 84px;color:var(--sub);}
#spec .vv{flex:1;color:var(--text);line-height:1.5;word-break:break-all;}
#spec .close{margin-top:14px;width:100%;padding:11px;border:none;border-radius:8px;background:#F3F3F3;color:#555;font-size:14.5px;cursor:pointer;font-family:inherit;}

/* ============ 空态 ============ */
.empty{text-align:center;padding:46px 20px;color:#B8B8B8;font-size:12.5px;}
.empty .ei svg{width:34px;height:34px;}
.empty .ei{font-size:36px;margin-bottom:12px;opacity:.45;}
.empty .ei svg{width:34px;height:34px;display:block;margin:0 auto;}

.copyright{text-align:center;font-size:10.5px;color:#BEBEBE;padding:12px 0 18px;}
.demo-note{margin:0 14px;padding:11px 13px;border-radius:9px;background:#E9F0FA;color:#1A4B85;font-size:11.5px;line-height:1.6;}
.demo-note b{color:#0D3A6B;}

/* 我的页 */
.mine-hd{background:var(--brand-grad);color:#fff;padding:20px;display:flex;align-items:center;gap:14px;}
.mine-hd .av{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:23px;border:1.5px solid rgba(255,255,255,.35);}
.mine-hd .nm{font-size:18px;font-weight:600;}
.mine-hd .dp{font-size:11.5px;opacity:.85;margin-top:4px;}

</style>

function hexToTint(hex, a){
  var c = String(hex||'#666666').trim();
  if(c.charAt(0) === '#') c = c.slice(1);
  if(c.length === 3) c = c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);

}

function getMenuByPage(pageId){
  return pageId === 'canteen_snack_order' ? SNACK_MENU : COFFEE_MENU;
}
function isSnack(pageId){ return pageId === 'canteen_snack_order'; }
function menuCatIdx(pageId){ return MENU_CAT[pageId] || 0; }
function menuCatPick(pageId, idx){ MENU_CAT[pageId] = idx; render(); }
function loadMenus(){
  // 先用兜底数据占位，保证任何协议（含 file://）都能立刻渲染
  COFFEE_MENU = MENU_FALLBACK_COFFEE;
  SNACK_MENU  = MENU_FALLBACK_SNACK;
  function pull(url, setter){
    try{
      var r = fetch(url);
      if(!r || !r.then) return;               // 极老浏览器
      r.then(function(res){ return res.json(); })
       .then(function(j){ if(j && j.categories && j.categories.length){ setter(j); render(); } })
       .catch(function(){ /* 保持兜底数据 */ });
    }catch(e){ /* file:// 等场景：忽略，继续用兜底 */ }
  }
  pull('coffee_menu.json', function(j){ COFFEE_MENU = j; });
  pull('snack_menu.json',  function(j){ SNACK_MENU  = j; });
}

// ---- 购物车 ----
function cartOf(pageId){ CART[pageId] = CART[pageId] || {}; return CART[pageId]; }
function cartAdd(pageId, catId, idx){
  var menu = getMenuByPage(pageId); if(!menu) return;
  var cat = menu.categories[menuCatIdx(pageId)]; if(!cat) return;
  var it = cat.items[idx]; if(!it) return;
  if(it.stock != null && it.stock <= 0){ toast('该商品已售罄'); return; }
  var k = cat.id + '|' + it.name;
  var c = cartOf(pageId);
  c[k] = c[k] || { name: it.name, price: it.price, qty: 0 };
  c[k].qty++;
  render();
}
function cartSub(pageId, catId, idx){
  var menu = getMenuByPage(pageId); if(!menu) return;
  var cat = menu.categories[menuCatIdx(pageId)]; if(!cat) return;
  var it = cat.items[idx]; if(!it) return;
  var k = cat.id + '|' + it.name;
  var c = cartOf(pageId);
  if(!c[k]) return;
  c[k].qty--;
  if(c[k].qty <= 0) delete c[k];
  render();
}
function cartQty(pageId, catId, name){
  var c = cartOf(pageId);
  var k = catId + '|' + name;
  return c[k] ? c[k].qty : 0;
}
function cartSum(pageId){
  var c = cartOf(pageId), qty = 0, amt = 0;
  Object.keys(c).forEach(function(k){ qty += c[k].qty; amt += c[k].qty * c[k].price; });
  return { qty: qty, amount: Math.round(amt * 100) / 100 };
}

// ---- 取餐时段生成 ----
// 面点卤菜：取餐方式固定 4 选 1（次日日期每天自动更新）
function nextDayLabel(offset){
  var d = new Date();
  d.setDate(d.getDate() + (offset || 1));
  return (d.getMonth()+1) + '/' + d.getDate();
}
function pickSlots(pageId){
  if(isSnack(pageId)){
    // 次日自动更新：每次渲染都按"明天"的日期重算
    var nd = nextDayLabel(1);
    return [
      {val:'next_noon',   lb:'次日 12:00-13:00', sub:nd + ' 取餐'},
      {val:'next_evening',lb:'次日 17:30-19:00', sub:nd + ' 取餐'},
      {val:'self_pick',   lb:'各行自取',          sub:'到店自取'},
      {val:'delivery',    lb:'分行派送',          sub:'送至分行'}
    ];
  }
  var out = [], start = 9*60+30, end = 19*60;
  for(var t = start; t <= end; t += 30){
    var h = Math.floor(t/60), m = t%60;
    out.push({val:(h<10?'0':'')+h + ':' + (m<10?'0':'')+m});
  }
  return out;
}
function openTimePicker(pageId){
  var cur = (BOOK[pageId] && BOOK[pageId].pick) || '';
  var items = pickSlots(pageId).map(function(x){
    var val = (typeof x === 'object') ? x.val : x;
    var lb  = (typeof x === 'object') ? x.lb  : x;
    var sub = (typeof x === 'object') ? (x.sub || '') : '';
    return {val:val, lb:lb, sub:sub, sel: cur===val};
  });
  PICKER = { type:'pick', pageId:pageId, title: isSnack(pageId) ? '选择取餐方式' : '选择取餐时间', items:items };
  renderPicker();
}

// ---- 提交 ----
function submitCoffee(pageId){
  var s = cartSum(pageId);
  if(s.qty === 0){ toast('请先选择商品'); return; }
  if(!BOOK[pageId] || !BOOK[pageId].pick){ openTimePicker(pageId); return; }
  var c = cartOf(pageId), names = [];
  Object.keys(c).forEach(function(k){ names.push(c[k].name + '×' + c[k].qty); });
  var u = getProfile();
  var r = STORE.add('orders', {
    pageId: pageId,
    title: isSnack(pageId) ? '面点卤菜预订' : '咖啡西点预订',
    cat:   isSnack(pageId) ? '面点卤菜预订' : '咖啡预订',
    summary: (isSnack(pageId) ? '面点卤菜' : '咖啡西点') + ' · 共' + s.qty + '件 ¥' + s.amount.toFixed(2) +
             ' · 取餐 ' + BOOK[pageId].pick + ' · ' + names.slice(0,3).join('、'),
    user: u.name, dept: u.dept, badge: u.badge, status: 'submitted',
    pickup_code: genPickupCode(),       // P2-6：6 位数字核销码
    payAmount: s.amount,
    ts: Date.now()
  });
  // P2-7：扣款失败提示（余额不足不静默失败）
  var pay = Payment.checkBalance(pageId, s.amount);
  if(!pay.ok){
    STORE.data.orders = STORE.data.orders.filter(function(x){ return x.id !== r.id; });
    STORE.save();
    Payment.showInsufficient(pay);
    return;
  }
  Wallet.spend('餐饮 · ' + (isSnack(pageId) ? '面点卤菜' : '咖啡西点'), s.amount, r.id);
  CART[pageId] = {};
  closePicker();
  toast('下单成功 · 单号 ' + r.id);
  setTimeout(function(){ go('#/my_applies'); }, 1200);
}

// ---- 点单页面渲染 ----
function renderMenuPage(screen, p, m){
  var menu = getMenuByPage(p.id);
  var C = P.colors['餐饮服务'];
  var h = '';
  if(!menu){
    h += '<div class="sect-t">' + esc(p.title) + '</div>' +
         '<div class="empty"><div class="ei">⏳</div>菜单数据加载中…<br><span style="font-size:12px;color:#999">请稍候</span></div>';
    screen.innerHTML = h; return;
  }
  var ci = menuCatIdx(p.id);
  if(ci >= menu.categories.length) ci = 0;
  var cat = menu.categories[ci];

  h += '<div class="wrap" style="margin-top:14px;margin-bottom:14px"><div style="display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px">';
  menu.categories.forEach(function(c, i){
    var on = i === ci;
    h += '<div onclick="menuCatPick(\'' + p.id + '\',' + i + ')" style="flex:0 0 auto;padding:7px 15px;border-radius:16px;font-size:12.5px;white-space:nowrap;cursor:pointer;' +
      (on ? 'background:' + C + ';color:#fff;font-weight:500' : 'background:#fff;color:#666;border:1px solid #E8E8E8') + '">' +
      esc(c.icon || '') + ' ' + esc(c.name) + '</div>';
  });
  h += '</div></div>';

  var items = cat.items || [];
  h += '<div class="sect-t">' + esc(cat.name) +
       '　<span style="font-weight:400;color:#8A8A8A;font-size:12px">共 ' + items.length + ' 款</span></div>';
  if(!items.length){
    h += '<div class="empty"><div class="ei">📦</div>本类商品暂未上架<br><span style="font-size:12px;color:#999">敬请期待</span></div>';
  } else {
    h += '<div class="wrap"><div class="form">';
    items.forEach(function(it, idx){
      var qty = cartQty(p.id, cat.id, it.name);
      var low = (it.stock != null && it.stock > 0 && it.stock <= 15);
      var out = (it.stock != null && it.stock <= 0);
      var rowBg = low ? 'background:#FFF8F0;' : '';
      if(out) rowBg = 'opacity:.5;';
      h += '<div class="fitem" style="' + rowBg + '">' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:14px;color:#222;font-weight:500">' + esc(it.name) + '</div>' +
          '<div style="font-size:11.5px;color:#999;margin-top:3px">' + esc(it.spec || '') +
            (it.stock != null ? ' · <span style="color:' + (low ? '#E8720C' : (out ? '#C00' : '#999')) + '">' +
              (out ? '已售罄' : (low ? '仅剩 ' + it.stock : '库存 ' + it.stock)) + '</span>' : '') +
            (it.sales ? ' · 已售 ' + it.sales : '') +
          '</div>' +
          (it.tags && it.tags.length ? '<div style="margin-top:4px">' + it.tags.map(function(t){
              return '<span style="display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;margin-right:4px;background:' +
                     C + '1A;color:' + C + '">' + esc(t) + '</span>';
            }).join('') + '</div>' : '') +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;flex:0 0 auto">' +
          '<span style="color:' + C + ';font-weight:600;font-size:14.5px">¥' + it.price + '</span>' +
          (qty > 0
            ? '<button onclick="cartSub(\'' + p.id + '\',\'' + cat.id + '\',' + idx + ')" style="width:24px;height:24px;border-radius:50%;border:1px solid #DDD;background:#fff;color:#666;font-size:15px;line-height:1;cursor:pointer">−</button>' +
              '<span style="min-width:16px;text-align:center;font-size:13px">' + qty + '</span>'
            : '') +
          '<button onclick="cartAdd(\'' + p.id + '\',\'' + cat.id + '\',' + idx + ')"' +
            (out ? ' disabled' : '') +
            ' style="width:24px;height:24px;border-radius:50%;border:0;background:' + (out ? '#CCC' : C) +
            ';color:#fff;font-size:16px;line-height:1;cursor:pointer">＋</button>' +
        '</div></div>';
    });
    h += '</div></div>';
  }

  var s = cartSum(p.id);
  h += '<div style="height:118px"></div>';
  h += '<div style="position:absolute;left:0;right:0;bottom:54px;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #EFEFEF;padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:60;box-shadow:0 -2px 10px rgba(0,0,0,.05)">' +
       '<div style="flex:1;font-size:12.5px;color:#666">已选 <b style="color:#222">' + s.qty + '</b> 件' +
       (s.qty ? '　¥<b style="color:' + C + ';font-size:15px">' + s.amount.toFixed(2) + '</b>' : '') + '</div>' +
       '<button onclick="submitCoffee(\'' + p.id + '\')"' + (s.qty ? '' : ' disabled') +
       ' style="padding:9px 22px;border:0;border-radius:20px;font-size:13.5px;color:#fff;background:' +
       (s.qty ? C : '#CCC') + ';cursor:pointer">去结算</button></div>';

  screen.innerHTML = h;
  // 点单页：隐藏悬浮 ⓘ，避免遮挡底部购物车条
  var _sb = document.getElementById('specbtn');
  if(_sb) _sb.classList.add('hide');
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function allPages(){ return P.modules.flatMap(m => m.pages.map(p => Object.assign({}, p, {_mod:m}))); }function pageById(id){
  const all = allPages();
  let p = all.find(x => x.id === id);
  if(p) return p;
  // 路由里小写连字符（canteen/coffee-order）→ 页面 id 用下划线（canteen_coffee_order）
  const norm = String(id).replace(/-/g, '_');
  p = all.find(x => x.id === norm);
  if(p) return p;
  // 再退一步：按 route 精确匹配
  const hash = '#/' + String(id).replace(/_/g, '/');
  p = all.find(x => x.route === hash);
  if(p) return p;
  return all.find(x => x.route && x.route.replace(/^#\//, '').split('/').join('_') === norm);
}

function tagClass(s){
  if(!s) return 'gray';
  if(/待上线|待审批|待处理|待执行|规划中/.test(s)) return 'orange';
  if(/已上线|已通过|已完成|已预约|已绑定|已同步|已打卡|已生成|已记录|已回复/.test(s)) return 'green';
  if(/驳回|异常/.test(s)) return 'red';
  if(/进行中|处理中|执行中/.test(s)) return 'blue';
  return 'gray';
}

function shade(hex, pct){
  const n = parseInt(hex.slice(1), 16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f = 1 + pct/100;
  r=Math.max(0,Math.min(255,Math.round(r*f)));
  g=Math.max(0,Math.min(255,Math.round(g*f)));
  b=Math.max(0,Math.min(255,Math.round(b*f)));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function _pad(n){ return n < 10 ? '0' + n : '' + n; }
function _dateList(){
  const out = [], WK = ['日','一','二','三','四','五','六'];
  const base = new Date(); base.setHours(0,0,0,0);   // 真实"今天"
  for(let i = 0; i < 14; i++){
    const d = new Date(base.getTime() + i * 86400000);
    const mm = d.getMonth() + 1, dd = d.getDate();
    let lb;
    if(i === 0) lb = '今天';
    else if(i === 1) lb = '明天';
    else if(i === 2) lb = '后天';
    else lb = '周' + WK[d.getDay()];
    out.push({val: d.getFullYear() + '-' + _pad(mm) + '-' + _pad(dd),
              lb: mm + '月' + dd + '日', sub: lb});
  }
  return out;
}

function pickItem(val){
  if(!PICKER) return;
  const it = PICKER.items.find(x => x.val === val);
  if(it && it.dis) return;
  // 来访起止时间：日期 -> 开始时间 -> 结束时间
  if(PICKER.type === 'visit_date'){
    var _vp = PICKER.pageId;
    setVisit(_vp, 'date', val);
    setVisit(_vp, 'start', '');
    setVisit(_vp, 'end', '');
    openVisitTime(_vp, val);
    return;
  }
  if(PICKER.type === 'visit_start'){
    var _vp2 = PICKER.pageId, _vd = PICKER.dateStr;
    setVisit(_vp2, 'start', val);
    setVisit(_vp2, 'end', '');
    openVisitEnd(_vp2, _vd, val);
    return;
  }
  if(PICKER.type === 'visit_end'){
    var _vp3 = PICKER.pageId;
    setVisit(_vp3, 'end', val);
    closePicker();
    render();
    return;
  }
  if(PICKER.type === 'dept'){ pickDept(val); return; }
  // P2-四：改期流程（第一步选日期 -> 第二步选时段 -> 提交）
  if(PICKER.type === 'reschedule'){
    var _bid = PICKER.bookingId, _pid2 = PICKER.pageId;
    BOOK[_pid2] = BOOK[_pid2] || {};
    BOOK[_pid2].date = val;
    var _slots = SLOT_LIB[_pid2] || ['09:00–10:00','10:00–11:00','14:00–15:00','15:00–16:00'];
    PICKER = {
      type: 'reschedule_slot',
      pageId: _pid2,
      bookingId: _bid,
      title: '改期 · 选择新时段',
      items: _slots.map(function(x, i){
        return { val: x, lb: x, sub: (i === 1 || i === 4) ? '已约满' : '', dis: (i === 1 || i === 4) };
      })
    };
    renderPicker();
    return;
  }
  if(PICKER.type === 'reschedule_slot'){
    var _bid2 = PICKER.bookingId, _pid3 = PICKER.pageId;
    BOOK[_pid3] = BOOK[_pid3] || {};
    BOOK[_pid3].slot = val;
    closePicker();
    doReschedule(_bid2, BOOK[_pid3].date, val);
    return;
  }
  // 点单页取餐时间：选定后直接下单
  if(PICKER.type === 'pick'){
    const _pid = PICKER.pageId;
    BOOK[_pid] = BOOK[_pid] || {};
    BOOK[_pid].pick = val;
    closePicker();
    submitCoffee(_pid);
    return;
  }
  const pid = PICKER.pageId;
  BOOK[pid] = BOOK[pid] || {};
  BOOK[pid][PICKER.type] = val;
  closePicker();
  render();
  const sc = document.getElementById('screen'); if(sc) sc.scrollTop = sc.scrollTop;
}

  // P2-3 + P2-8：生成预约凭证 BK-YYYYMMDD-###
  var v = Voucher.issue(p ? p.title : '预约', b.date, b.slot, pageId);

function submitGeneric(pageId){
  var m = APPLY_MAP[pageId] || {kind:'applies', cat:'综合业务', sum:'业务申请'};
  var p = pageById(pageId);
  var u = getProfile();
  var d = new Date();
  var dd = d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();
  // 组装摘要
  var parts = [];
  if(pageId === 'office_car_apply'){ parts.push('用车'); }
  if(pageId === 'canteen_weekend_order'){ parts.push('报备人数以实际为准'); }
  // 把该页填的字段拼进摘要
  var extra = [];
  Object.keys(BOOK).forEach(function(k){
    if(k.indexOf('f_' + pageId + '_') === 0 && BOOK[k]){
      var nm = k.replace('f_' + pageId + '_', '');
      if(/备注|建议|意见|原因|事由/.test(nm)) extra.push(BOOK[k].slice(0, 24));
      else extra.push(nm + '：' + BOOK[k]);
    }
    if(k.indexOf('num_' + pageId + '_') === 0 && BOOK[k] != null){
      extra.push(k.replace('num_' + pageId + '_','') + '：' + BOOK[k]);
    }
  });
  var summary = m.sum + ' · ' + dd + (extra.length ? ' · ' + extra.slice(0,3).join('，') : '');
  // P2-1：维修请求 / 物品申领 共用四态跟踪
  var isWorkTicket = (m.kind === 'repairs') || (pageId === 'office_item_apply');
  var r = STORE.add(m.kind, {
    pageId: pageId,
    title: (p ? p.title : m.cat),
    cat: m.cat,
    summary: summary,
    user: u.name,
    dept: u.dept,
    badge: u.badge,
    status: isWorkTicket ? '已提交' : '待审批'
  });
  if(isWorkTicket){ TicketLog.init(r.id); }
  closePicker();
  // P2-1：提交成功后提示"已提交，等待接单"
  toast(isWorkTicket ? '已提交，等待接单 · 单号 ' + r.id : '提交成功 · 单号 ' + r.id);
  setTimeout(function(){ go('#/my_applies'); }, 1300);
}

// ==================== 本地存储数据层 STORE ====================
const STORE_KEY = 'icbc_oa_demo_v1';
const STORE = {
  data: { bookings: [], applies: [], orders: [], evals: [], repairs: [], profile: {} },
  load(){
    try{
      const s = localStorage.getItem(STORE_KEY);
      if(s){ const d = JSON.parse(s); Object.keys(d).forEach(k => this.data[k] = d[k]); }
    }catch(e){}
  },
  save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); }catch(e){}
  },
  add(kind, obj){
    obj.id = 'NO' + Date.now().toString().slice(-8) + Math.floor(Math.random()*90+10);
    obj.createdAt = new Date().toISOString();
    obj.createdStr = this.nowStr();
    this.data[kind].unshift(obj);
    this.save();
    return obj;
  },
  list(kind){ return this.data[kind] || []; },
  // P2-四：取消预约（状态 -> 已取消）
  cancelBooking(id){
    var b = null;
    (this.data.bookings || []).forEach(function(r){ if(r.id === id) b = r; });
    if(!b) return { ok: false, msg: '预约不存在' };
    if(b.status === '已取消') return { ok: false, msg: '该预约已取消' };
    b.status = '已取消';
    b.cancelledAt = this.nowStr();
    this.save();
    return { ok: true, booking: b };
  },
  // P2-四：改期（更新预约日期 / 时段）
  rescheduleBooking(id, newDate, newSlot){
    var b = null;
    (this.data.bookings || []).forEach(function(r){ if(r.id === id) b = r; });
    if(!b) return { ok: false, msg: '预约不存在' };
    if(b.status === '已取消') return { ok: false, msg: '该预约已取消，不可改期' };
    if(!newDate) return { ok: false, msg: '请选择新日期' };
    b.date = newDate;
    if(newSlot) b.slot = newSlot;
    b.status = '预约成功';
    b.rescheduledAt = this.nowStr();
    b.rescheduleCount = (b.rescheduleCount || 0) + 1;
    this.save();
    return { ok: true, booking: b };
  },
  nowStr(){
    const d = new Date();
    const p = n => (n<10?'0':'')+n;
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  },
  clearAll(){ this.data = {bookings:[],applies:[],orders:[],evals:[],repairs:[],profile:{}}; this.save(); }
};

  }
  const mod = p._mod;
  renderTab(null);
  renderNav({title:p.title, back:true, icbc:true});
  var _sb0 = document.getElementById('specbtn');
  if(_sb0) _sb0.classList.toggle('hide', p.type === 'menu');

  else if(p.type === 'list') renderList(screen, p, mod);
  else renderDetail(screen, p, mod);
}

function renderKKEditor(){
  var box = document.getElementById('specbox');
  var all = allPages();  var h = '<div class="kk-ed-hd"><div class="t">编辑金刚区</div>' +
          '<div class="x" onclick="closeKKEditor()">✕</div></div>';

  // 已添加
  h += '<div class="kk-ed-sub"><span>已添加 (' + KK_EDIT.length + '/' + KK_MAX + ')</span>' +
       '<span style="font-size:11px;color:#BBB">↑↓ 调序 · ✕ 移除</span></div>';
  if(!KK_EDIT.length){
    h += '<div style="font-size:12.5px;color:#BBB;padding:10px 0">还没有添加入口，从下方选择</div>';
  }else{
    KK_EDIT.forEach(function(id, i){
      var p = pageById(id);
      var k = getKKItem(id);
      h += '<div class="kk-ed-item">' +
        '<div class="ico" style="background:' + k.bg + ';color:' + k.fg + '">' + (k.ic || SVG_ICON._fallback) + '</div>' +
        '<div class="nm' + (p ? '' : ' bad') + '">' + esc(k.lb) + '</div>' +
        '<div class="kk-ed-btns">' +
          '<button onclick="kkMove(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
          '<button onclick="kkMove(' + i + ',1)"' + (i === KK_EDIT.length - 1 ? ' disabled' : '') + '>↓</button>' +
          '<button class="del" onclick="kkRemove(\'' + id + '\')">✕</button>' +
        '</div></div>';
    });
  }

  // 可添加
  var full = KK_EDIT.length >= KK_MAX;
  h += '<div class="kk-ed-sub"><span>添加入口' + (full ? '（已达上限 ' + KK_MAX + ' 个）' : '') + '</span></div>';
  h += '<div class="kk-ed-tags">';
  all.forEach(function(p){
    var on = KK_EDIT.indexOf(p.id) >= 0;
    h += '<span class="kk-ed-tag' + (on ? ' on' : (full ? '' : ' add')) + '"' +
      (on || full ? '' : ' onclick="kkAdd(\'' + p.id + '\')"') + '>' +
      (on ? '✓ ' : '+ ') + esc(p.title) + '</span>';
  });
  h += '</div>';

  // 底部
  h += '<div class="kk-ed-ft">' +
       '<span class="rst" onclick="kkReset()">恢复默认</span>' +
       '<button class="ok" onclick="kkConfirm()">完成</button></div>';
  box.innerHTML = h;
}

function kkMove(idx, dir){
  var t = idx + dir;
  if(t < 0 || t >= KK_EDIT.length) return;
  var item = KK_EDIT.splice(idx, 1)[0];
  KK_EDIT.splice(t, 0, item);
  renderKKEditor();
}
function kkRemove(id){
  KK_EDIT = KK_EDIT.filter(function(x){ return x !== id; });
  renderKKEditor();
}
function kkAdd(id){
  if(KK_EDIT.length >= KK_MAX) return;
  if(KK_EDIT.indexOf(id) >= 0) return;
  KK_EDIT.push(id);
  renderKKEditor();
}
function kkReset(){
  if(!confirm('确定恢复默认 8 项？')) return;
  resetKKIds();
  closeKKEditor();
  render();
}
function kkConfirm(){
  var ids = KK_EDIT.filter(function(id){ return pageById(id) !== undefined; });
  if(!ids.length){
    if(!confirm('金刚区将为空，确定？')) return;
  }
  saveKKIds(ids);
  closeKKEditor();
  render();
}

var _bannerTimer = null;
var _bannerIdx = 0;
var BANNER_INTERVAL = 3500;

function renderBanner(){
  var h = '<div class="banner-wrap" id="oaBanner">';
  h += '<div class="banner-track" id="oaBannerTrack">';
  OA_BANNERS.forEach(function(b){
    var src = typeof b === 'string' ? b : b.img;
    var link = (typeof b === 'object' && b.link) ? b.link : '';
    var tap = link ? ' onclick="location.hash=\'' + link + '\'"' : '';
    h += '<img class="banner-img" src="' + src + '" alt="宣传图"' + tap + '>';
  });
  h += '</div>';
  h += '<div class="banner-dots" id="oaBannerDots">';
  OA_BANNERS.forEach(function(_, i){
    h += '<span class="dot' + (i === 0 ? ' on' : '') + '"></span>';
  });
  h += '</div></div>';
  return h;
}

function _bannerPaint(){
  var track = document.getElementById('oaBannerTrack');
  if(track) track.style.transform = 'translateX(-' + (_bannerIdx * 100) + '%)';
  var dots = document.getElementById('oaBannerDots');
  if(dots){
    var ds = dots.querySelectorAll('.dot');
    for(var i = 0; i < ds.length; i++){
      if(i === _bannerIdx) ds[i].classList.add('on');
      else ds[i].classList.remove('on');
    }
  }
}

function _bannerStart(){
  _bannerStop();                       // 先清旧的，防叠加
  if(!document.getElementById('oaBannerTrack')) return;   // 不在首页则不跑
  _bannerIdx = 0;
  _bannerPaint();
  if(OA_BANNERS.length < 2) return;    // 单图不轮播
  _bannerTimer = setInterval(function(){
    _bannerIdx = (_bannerIdx + 1) % OA_BANNERS.length;
    _bannerPaint();
  }, BANNER_INTERVAL);
}

function _bannerStop(){
  if(_bannerTimer){ clearInterval(_bannerTimer); _bannerTimer = null; }
}

function renderTab(active){
  let t = document.getElementById('tabbar');
  if(!t){
    t = document.createElement('div'); t.id = 'tabbar';
    t.innerHTML = TABS.map(x =>
      '<div class="tb" data-k="' + x.key + '"><div class="i">' + x.ic + '</div><div>' + x.lb + '</div>' +
      (x.key === 'msg' ? '<span class="bdg" id="tab_msg_bdg"></span>' : '') + '</div>').join('');
    document.getElementById('phone').insertBefore(t, document.getElementById('spec'));
    t.querySelectorAll('.tb').forEach(el => {
      el.onclick = () => {
        const tab = TABS.find(x => x.key === el.dataset.k);
        hist = [];
        ROUTE = tab.route;
        // 2026-09-23 Codex 复核：原用 history.replaceState 会覆盖当前历史项、污染前进/后退栈；
        // 改用 location.replace('#/xxx')：仍是替换（不新增栈项），但会触发 hashchange
        // （配合全局 hashchange 监听，前进/后退时 tab 高亮能正确重同步）
        if(location.hash !== tab.route){ location.replace(tab.route); }
        render();
        const sc = document.getElementById('screen'); if(sc) sc.scrollTop = 0;
      };
    });
  }
  t.querySelectorAll('.tb').forEach(el => el.classList.toggle('on', el.dataset.k === active));
  updateMsgTabBadge();
}
// 消息 Tab 未读角标（独立更新，不重绘整条 tabbar）
function updateMsgTabBadge(){
  try{
    const b = document.getElementById('tab_msg_bdg');
    if(!b) return;
    const n = (typeof MSG !== 'undefined' && MSG) ? MSG.unreadCount() : 0;
    if(n > 0){ b.textContent = (n > 99 ? '99+' : n); b.classList.add('show'); }
    else { b.textContent = ''; b.classList.remove('show'); }
  }catch(e){}
}

function fieldHtml(f){
  const name = typeof f === 'string' ? f : (f.label || f.name || '字段');
  const type = typeof f === 'object' ? (f.type || 'text') : 'text';
  const req  = typeof f === 'object' ? f.required : false;
  const ph   = typeof f === 'object' ? (f.placeholder || '') : '';
  const label = '<div class="flabel">' + (req ? '<em>*</em>' : '') + esc(name) + '</div>';

  if(/人数|数量/.test(name)){
    const pid = f._pid || '';
    const k = 'num_' + pid + '_' + name;
    const v = (BOOK[k] != null ? BOOK[k] : 12);
    return '<div class="fitem">' + label + '<div class="stepper" style="margin-left:auto">' +
      '<button onclick="stepNum(\'' + k + '\',-1)">−</button>' +
      '<span id="sn_' + esc(k) + '">' + v + '</span>' +
      '<button onclick="stepNum(\'' + k + '\',1)">＋</button></div></div>';
  }
  // 来访起止时间：先选日期，再选起止时间（几点到几点）
  if(type === 'daterange' || /起止时间/.test(name)){
    const pid0 = f._pid || (window._curPid || '');
    const st = visitRange(pid0);
    const disp = st.date
      ? (function(){
          var mm = parseInt(st.date.split('-')[1], 10);
          var dd = parseInt(st.date.split('-')[2], 10);
          return mm + '月' + dd + '日 ' + (st.start || '--:--') + ' - ' + (st.end || '--:--');
        })()
      : '';
    return '<div class="fitem" onclick="openVisitDate(\'' + pid0 + '\')" style="cursor:pointer">' + label +
      '<div class="fval' + (disp ? '' : ' ph') + '" style="text-align:right">' + (disp || '请选择日期与时间') +
      '<span class="farrow">›</span></div></div>';
  }
  if(/日期|时间|时段/.test(name)){
    const pid = f._pid || (window._curPid || '');
    const isSlot = /时段|时间/.test(name);
    const cur = isSlot ? bookVal(pid, 'slot') : bookVal(pid, 'date');
    const disp = cur || (isSlot ? '请选择时段' : (function(){
      var d = new Date();
      return (d.getMonth()+1) + '月' + d.getDate() + '日';
    })());
    return '<div class="fitem" onclick="bookField(\'' + (isSlot ? 'slot' : 'date') + '\',\'' + pid + '\')" style="cursor:pointer">' + label +
      '<div class="fval' + (cur ? '' : ' ph') + '" style="text-align:right">' + esc(disp) +
      '<span class="farrow">›</span></div></div>';
  }
  if(/填报部门|^部门$|所在部门|申请部门/.test(name)){
    const pid = f._pid || '';
    const cur = deptName(pid);
    return '<div class="fitem" onclick="openDeptPicker(\'' + pid + '\')" style="cursor:pointer">' + label +
      '<div class="fval' + (cur ? '' : ' ph') + '" style="text-align:right">' + (cur || '请选择') +
      '<span class="farrow">›</span></div></div>';
  }
  if(/联系电话|电话/.test(name)){
    const pid = f._pid || '';
    const t = deptTel(pid);
    return '<div class="fitem">' + label +
      '<div class="fval' + (t ? '' : ' ph') + '" style="text-align:right">' + (t || '选择部门后自动带出') + '</div></div>';
  }
  if(/机构|地点|车|类型|分类|餐次|场次|会议室|接待对象/.test(name))
    return '<div class="fitem">' + label + '<div class="fval ph">请选择<span class="farrow">›</span></div></div>';
  const pid2 = f._pid || '';
  const fk = 'f_' + pid2 + '_' + name;
  if(/备注|说明|意见|建议|原因|详情|描述|内容|事项|问题/.test(name) || type === 'textarea'){
    const cv = BOOK[fk] || '';
    return '<div class="fitem" style="flex-direction:column;align-items:stretch">' +
      '<div class="flabel" style="width:auto;margin-bottom:8px">' + (req?'<em>*</em>':'') + esc(name) + '</div>' +
      '<textarea oninput="setField(\'' + esc(fk) + '\',this.value)" placeholder="' + esc(ph || '请填写' + name) + '" ' +
      'style="background:#F7F7F9;border:0;border-radius:9px;padding:10px;min-height:56px;font-size:13px;color:#222;font-family:inherit;resize:none;outline:none">' +
      esc(cv) + '</textarea></div>';
  }
  const cv2 = BOOK[fk] || '';
  return '<div class="fitem">' + label +
    '<input class="finput" value="' + esc(cv2) + '" oninput="setField(\'' + esc(fk) + '\',this.value)" ' +
    'placeholder="' + esc(ph || '请输入' + name) + '"></div>';
}

// ============ P2-八：凭证编号统一规则 BK-YYYYMMDD-### ============
// 同一用户同一天多个预约，序号递增
const Voucher = {
  KEY: 'icbc_p2_voucher_seq',
  todayKey(){
    var d = new Date();
    var p = n => (n < 10 ? '0' : '') + n;
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
  },
  nextNo(){
    var ymd = this.todayKey();
    var seq = {};
    try{ seq = JSON.parse(localStorage.getItem(this.KEY) || '{}'); }catch(e){ seq = {}; }
    seq[ymd] = (seq[ymd] || 0) + 1;
    try{ localStorage.setItem(this.KEY, JSON.stringify(seq)); }catch(e){}
    // P2-八：BK-YYYYMMDD-###（### 为当日序号，3 位补零）
    return 'BK-' + ymd + '-' + (seq[ymd] < 10 ? '00' : (seq[ymd] < 100 ? '0' : '')) + seq[ymd];
  },
  // 生成凭证并落盘
  issue(title, date, slot, pageId){
    var no = this.nextNo();
    var list = [];
    try{ list = JSON.parse(localStorage.getItem('icbc_p2_vouchers') || '[]'); }catch(e){ list = []; }
    var v = { no: no, title: title, date: date, slot: slot, pageId: pageId, at: Date.now() };
    list.unshift(v);
    if(list.length > 200) list = list.slice(0, 200);
    try{ localStorage.setItem('icbc_p2_vouchers', JSON.stringify(list)); }catch(e){}
    return v;
  },
  // 查已生成凭证（无则补生成，保证老数据也有凭证）
  ensure(booking){
    var list = [];
    try{ list = JSON.parse(localStorage.getItem('icbc_p2_vouchers') || '[]'); }catch(e){ list = []; }
    var hit = list.filter(function(v){
      return v.title === booking.title && v.date === booking.date && v.slot === booking.slot;
    })[0];
    if(hit) return hit;
    return this.issue(booking.title, booking.date, booking.slot, booking.pageId);
  }
};

// ============ P2-三/六：二维码（CSS 绘制示意，不依赖任何库）============
// 用确定性伪随机根据字符串生成 21×21 点阵，纯 CSS box-shadow 渲染
function qrPayload(str){
  var h = 5381;
  for(var i = 0; i < String(str).length; i++){
    h = ((h << 5) + h + String(str).charCodeAt(i)) >>> 0;
  }
  return h;
}
function renderQRCodeCSS(text){
  var h = qrPayload(text);
  var N = 21, cell = 4, dots = [];
  for(var y = 0; y < N; y++){
    for(var x = 0; x < N; x++){
      // 三个定位角（左上 / 右上 / 左下）
      var inFinder = (x < 7 && y < 7) || (x > N - 8 && y < 7) || (x < 7 && y > N - 8);
      var posFinder = ((x === 0 || x === 6) && y < 7) || ((y === 0 || y === 6) && x < 7)
                   || ((x === N-1 || x === N-7) && y < 7) || ((y === 0 || y === 6) && x > N-8)
                   || ((x === 0 || x === 6) && y > N-8) || ((y === N-1 || y === N-7) && x < 7)
                   || (x >= 2 && x <= 4 && y >= 2 && y <= 4)
                   || (x >= N-5 && x <= N-3 && y >= 2 && y <= 4)
                   || (x >= 2 && x <= 4 && y >= N-5 && y <= N-3);
      var on = inFinder ? posFinder : (((h >> ((x * 3 + y) % 31)) ^ (h + x * 7 + y * 13)) & 1) === 1;
      if(on) dots.push((x * cell) + 'px ' + (y * cell) + 'px 0 0 #111');
    }
  }
  var size = N * cell;
  return '<div style="width:' + size + 'px;height:' + size + 'px;margin:0 auto;position:relative;background:#fff;border-radius:4px">' +
    '<div style="position:absolute;left:0;top:0;width:' + cell + 'px;height:' + cell + 'px;box-shadow:' +
      dots.join(',') + '"></div></div>';
}

const Wallet = {
  KEY: 'icbc_p2_wallet',
  DEFAULT: {
    balance: 328.50,
    agreement: { signed: true, signedAt: '2026-08-15', status: '已签署' },
    flow: [
      { time: '2026-09-16 12:03', type: '消费', title: '食堂消费', amount: -18.00, status: '成功' },
      { time: '2026-09-15 15:20', type: '消费', title: '咖啡西点', amount: -22.00, status: '成功' },
      { time: '2026-09-10 09:00', type: '充值', title: '账户充值', amount: 500.00, status: '成功' },
      { time: '2026-09-08 14:12', type: '退款', title: '预约取消退回', amount: 20.00, status: '成功' },
      { time: '2026-09-05 11:30', type: '消费', title: '理发预约', amount: -20.00, status: '成功' }
    ]
  },
  load(){
    try{
      var d = JSON.parse(localStorage.getItem(this.KEY) || 'null');
      if(d && typeof d.balance === 'number') return d;
    }catch(e){}
    this.save(this.DEFAULT);
    return JSON.parse(JSON.stringify(this.DEFAULT));
  },
  save(d){
    try{ localStorage.setItem(this.KEY, JSON.stringify(d)); }catch(e){}
  },
  agreement(){
    var d = this.load();
    return d.agreement || { signed: false, signedAt: '', status: '未签署' };
  },
  signAgreement(){
    var d = this.load();
    var p = n => (n < 10 ? '0' : '') + n;
    var t = new Date();
    d.agreement = {
      signed: true,
      signedAt: t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()),
      status: '已签署'
    };
    this.save(d);
  },
  // 消费（记流水 + 扣余额）
  spend(title, amount, refId){
    var d = this.load();
    d.balance = Math.round((d.balance - amount) * 100) / 100;
    d.flow.unshift({
      time: STORE.nowStr(), type: '消费', title: title,
      amount: -Math.abs(amount), status: '成功', ref: refId || ''
    });
    if(d.flow.length > 50) d.flow = d.flow.slice(0, 50);
    this.save(d);
  },
  // 退款（取消预约时调用）
  refund(title, amount, refId){
    var d = this.load();
    d.balance = Math.round((d.balance + amount) * 100) / 100;
    d.flow.unshift({
      time: STORE.nowStr(), type: '退款', title: title,
      amount: Math.abs(amount), status: '成功', ref: refId || ''
    });
    if(d.flow.length > 50) d.flow = d.flow.slice(0, 50);
    this.save(d);
  },
  recharge(amount){
    var d = this.load();
    d.balance = Math.round((d.balance + amount) * 100) / 100;
    d.flow.unshift({
      time: STORE.nowStr(), type: '充值', title: '账户充值',
      amount: Math.abs(amount), status: '成功'
    });
    if(d.flow.length > 50) d.flow = d.flow.slice(0, 50);
    this.save(d);
  },
  recent(n){ return this.load().flow.slice(0, n || 5); }
};

// ============ P2-一/二/九：维修&物品工单四态跟踪 + 评价 ============
const TICKET_STATES = [
  { key: 'all',        label: '全部',   color: '#666666' },
  { key: 'submitted',  label: '已提交', color: '#1E5AA8' },
  { key: 'accepted',   label: '已接单', color: '#B45309' },
  { key: 'processing', label: '处理中', color: '#0E7490' },
  { key: 'done',       label: '已完成', color: '#0F8A5F' }
];
const TICKET_FLOW = ['submitted', 'accepted', 'processing', 'done'];

// 判定是否属于"维修/物品工单"（P2-一：维修请求 / 物品申领共用）
function isTicket(r){
  if(!r) return false;
  if(r._kind === 'repairs') return true;
  if(r._kind === 'applies' && r.pageId === 'office_item_apply') return true;
  return false;
}

const TicketLog = {
  KEY: 'icbc_p2_tickets',
  all(){
    try{ return JSON.parse(localStorage.getItem(this.KEY) || '{}'); }catch(e){ return {}; }
  },
  save(d){ try{ localStorage.setItem(this.KEY, JSON.stringify(d)); }catch(e){} },
  // 新建工单默认"已提交"
  init(id){
    var d = this.all();
    if(d[id]) return d[id];
    d[id] = {
      state: 'submitted',
      history: [{ state: 'submitted', at: Date.now(), by: '本人', note: '工单已提交，等待接单' }],
      assignee: '', eta: '', rated: false, rating: 0, review: '', ratedAt: 0
    };
    this.save(d);
    return d[id];
  },
  // 状态推进（已提交 → 已接单 → 处理中 → 已完成）
  advance(id){
    var d = this.all();
    if(!d[id]) this.init(id);
    var t = d[id];
    var idx = TICKET_FLOW.indexOf(t.state);
    if(idx < 0 || idx >= TICKET_FLOW.length - 1) return { ok: false, msg: '工单已完成，无法继续推进' };
    var next = TICKET_FLOW[idx + 1];
    t.state = next;
    t.history.push({
      state: next, at: Date.now(),
      by: (next === 'accepted' || next === 'processing') ? '受理人' : '系统',
      note: ({
        accepted: '工单已被接单，受理人已确认',
        processing: '工程师开始处理',
        done: '工单已完成'
      })[next]
    });
    if(next === 'accepted'){
      t.assignee = t.assignee || '王工（科技部）';
      t.eta = t.eta || '预计 2 小时内完成';
    }
    this.save(d);
    return { ok: true, to: next };
  },
  get(id){ var d = this.all(); return d[id] ? d[id].state : 'submitted'; },
  detail(id){ return this.all()[id]; },
  label(k){
    var s = TICKET_STATES.filter(function(x){ return x.key === k; })[0];
    return s ? s.label : '已提交';
  },
  color(k){
    var s = TICKET_STATES.filter(function(x){ return x.key === k; })[0];
    return s ? s.color : '#1E5AA8';
  },
  // P2-二/九：评价 —— 仅"已完成"可评，且只能评一次
  canRate(id){
    var t = this.detail(id);
    if(!t) return false;
    return t.state === 'done' && !t.rated;    // P2-九：已评价过则不再显示入口
  },
  rate(id, stars, text){
    var t = this.detail(id);
    if(!t) return { ok: false, msg: '工单不存在' };
    if(t.state !== 'done') return { ok: false, msg: '工单尚未完成，无法评价' };
    if(t.rated) return { ok: false, msg: '已评价过，不能重复评价' };   // P2-九
    t.rated = true; t.rating = stars; t.review = text || ''; t.ratedAt = Date.now();
    var d = this.all(); d[id] = t; this.save(d);
    return { ok: true, msg: '感谢您的评价' };
  }
};

// 演示用：为已有工单铺开不同状态（仅首次执行，不回溯已有进度）
function seedTicketProgress(){
  // 只在第一次加载时播种一次，避免把用户推进过的状态重置
  try{
    if(localStorage.getItem('icbc_p2_seeded') === '1') return;
    localStorage.setItem('icbc_p2_seeded', '1');
  }catch(e){}
  var d = TicketLog.all();
  var ids = Object.keys(d);
  if(ids.length < 2) return;
  ids.forEach(function(id, i){
    var t = d[id];
    if(t.state !== 'submitted') return;
    var want = TICKET_FLOW[Math.min(i % 4, 3)];
    if(want === 'submitted') return;
    var idx = TICKET_FLOW.indexOf(want);
    for(var k = 1; k <= idx; k++){
      var st = TICKET_FLOW[k];
      if(!t.history.filter(function(x){ return x.state === st; }).length){
        t.history.push({
          state: st, at: Date.now() - (idx - k) * 3600000,
          by: k <= 2 ? '受理人' : '系统',
          note: ({
            accepted: '工单已被接单，受理人已确认',
            processing: '工程师开始处理',
            done: '工单已完成'
          })[st]
        });
      }
    }
    t.state = want;
    if(idx >= 1){ t.assignee = t.assignee || '王工（科技部）'; t.eta = t.eta || '预计 2 小时内完成'; }
  });
  TicketLog.save(d);
}

       renderQRCodeCSS(opts.no + '|' + (opts.title || '') + '|' + (opts.date || '')) +
       '<div style="font-size:11px;color:#9A9A9A;margin-top:9px">出示此二维码核销，或报凭证编号</div>' +
       '</div>';
  // 摘要
  h += '<div style="padding:6px 18px 18px"><div style="border-top:1px dashed #ECECEC;padding-top:12px">';
  h += kvLine('凭证编号', opts.no);
  if(opts.date) h += kvLine('预约日期', opts.date);
  if(opts.slot) h += kvLine('预约时段', opts.slot);
  if(opts.extra){
    opts.extra.forEach(function(x){ h += kvLine(x[0], x[1]); });
  }
  h += '</div></div>';
  if(opts.showHint !== false){
    h += '<div style="background:#FFF7F6;color:#A50008;font-size:11.5px;padding:11px 18px;line-height:1.65">' +
         '📌 请提前 5 分钟到达，出示凭证核销。如需变更，可在「我的预约」中改期或取消。</div>';
  }
  h += '</div>';
  return h;
}

// ============ P2-四：取消 / 改期 ============
function askCancelBooking(id){
  var bk = null;
  STORE.list('bookings').forEach(function(r){ if(r.id === id) bk = r; });
  if(!bk || bk.status === '已取消'){ toast('该预约已取消'); return; }
  var old = document.getElementById('confirmbox'); if(old) old.remove();
  var el = document.createElement('div');
  el.id = 'confirmbox';
  el.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:150;' +
    'display:flex;align-items:center;justify-content:center;padding:0 34px';
  el.onclick = function(e){ if(e.target === el) el.remove(); };
  var h = '<div style="width:100%;background:#fff;border-radius:14px;padding:22px 20px 18px;text-align:center">';
  h += '<div style="font-size:30px;line-height:1;margin-bottom:10px">🗓️</div>';
  h += '<div style="font-size:16px;font-weight:600;color:#1A1A1A;margin-bottom:8px">确认取消预约？</div>';
  h += '<div style="font-size:12.5px;color:#8A8A8A;line-height:1.7;margin-bottom:15px">';
  h += esc(bk.title) + '<br>' + esc(bk.date) + '　' + esc(bk.slot);
  if(bk.voucherNo) h += '<br>凭证 ' + esc(bk.voucherNo) + ' 将同时作废';
  h += '</div>';
  h += '<button id="cbox_ok" style="width:100%;padding:12px;border:0;border-radius:9px;' +
       'background:#C7000B;color:#fff;font-size:14.5px;font-weight:500;cursor:pointer;' +
       'font-family:inherit;margin-bottom:9px">确认取消</button>';
  h += '<button id="cbox_no" style="width:100%;padding:11px;border:0;border-radius:9px;' +
       'background:#F3F3F3;color:#666;font-size:14px;cursor:pointer;font-family:inherit">再想想</button>';
  h += '</div>';
  el.innerHTML = h;
  document.getElementById('phone').appendChild(el);
  document.getElementById('cbox_ok').onclick = function(){ doCancelBooking(id); };
  document.getElementById('cbox_no').onclick = function(){ el.remove(); };
}

function doCancelBooking(id){
  var box = document.getElementById('confirmbox'); if(box) box.remove();
  var r = STORE.cancelBooking(id);          // 状态 -> 已取消
  if(!r.ok){ toast(r.msg); return; }
  // 已扣费则原路退款（写入钱包流水）
  if(r.booking && r.booking.payAmount > 0){
    Wallet.refund('预约取消退回 · ' + (r.booking.title || ''), r.booking.payAmount, id);
  }
  toast('已取消，状态更新为「已取消」');
  setTimeout(function(){ render(); }, 900);
}

// P2-四：改期 —— 先选新日期，再选新时段
function askRescheduleBooking(id){
  var bk = null;
  STORE.list('bookings').forEach(function(r){ if(r.id === id) bk = r; });
  if(!bk || bk.status === '已取消'){ toast('该预约已取消，不可改期'); return; }
  PICKER = {
    type: 'reschedule',
    pageId: bk.pageId,
    bookingId: id,
    title: '改期 · 选择新日期',
    items: _dateList().map(function(x){
      return { val: x.val, lb: x.lb, sub: x.sub, sel: bk.date === x.val };
    })
  };
  renderPicker();
}

function doReschedule(id, newDate, newSlot){
  var r = STORE.rescheduleBooking(id, newDate, newSlot);
  if(!r.ok){ toast(r.msg); return; }
  toast('改期成功 · 新时段 ' + newDate + ' ' + newSlot);
  setTimeout(function(){ go('#/my_bookings'); }, 1100);
}

// ============ P2-一/二/九：工单详情页（四态时间轴 + 派单信息 + 评价）============
function renderTicketDetail(screen, kind, ticketId){
  renderNav({title:'工单详情', back:true, icbc:true});
  var rec = null;
  (STORE.list(kind) || []).forEach(function(r){ if(r.id === ticketId) rec = r; });
  var h = '<div class="wrap">';
  if(!rec){
    h += '<div class="empty"><div class="ei">🔧</div>工单不存在</div></div>';
    screen.innerHTML = h; return;
  }
  if(!TicketLog.detail(ticketId)) TicketLog.init(ticketId);
  var t = TicketLog.detail(ticketId);
  var curColor = TicketLog.color(t.state);

  // 顶部状态头
  h += '<div style="margin:0 -14px 12px;padding:18px 20px;background:' + curColor + ';color:#fff">' +
       '<div style="font-size:11.5px;opacity:.85">当前状态</div>' +
       '<div style="font-size:22px;font-weight:600;margin-top:4px">' + esc(TicketLog.label(t.state)) + '</div>' +
       '<div style="font-size:11.5px;opacity:.85;margin-top:6px">单号 ' + esc(rec.id) + ' · ' + esc(rec.createdStr || '') + '</div>' +
       '</div>';

  // P2-一：四态时间轴（已提交 → 已接单 → 处理中 → 已完成）
  h += '<div class="sect-t">处理进度（四态跟踪）</div>';
  h += '<div class="form" style="padding:14px 15px">';
  var curIdx = TICKET_FLOW.indexOf(t.state);
  TICKET_FLOW.forEach(function(st, i){
    var passed = i <= curIdx;
    var isCur = i === curIdx;
    var at = '';
    t.history.forEach(function(x){ if(x.state === st) at = x.at; });
    var col = passed ? TicketLog.color(st) : '#D8D8D8';
    h += '<div style="display:flex;gap:11px;align-items:flex-start;position:relative;padding-bottom:' + (i < 3 ? '16px' : '0') + '">';
    if(i < 3){
      h += '<div style="position:absolute;left:8px;top:20px;width:2px;height:calc(100% - 6px);background:' +
           (i < curIdx ? TicketLog.color(st) : '#EEE') + '"></div>';
    }
    h += '<div style="flex:0 0 18px;width:18px;height:18px;border-radius:50%;background:' + col +
         ';color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;margin-top:2px;z-index:1">' +
         (passed ? '✓' : '') + '</div>';
    h += '<div style="flex:1">' +
         '<div style="font-size:13.5px;font-weight:' + (isCur ? '600' : '400') + ';color:' +
           (passed ? '#1A1A1A' : '#B8B8B8') + '">' + esc(TicketLog.label(st)) +
           (isCur ? '　<span class="tag" style="position:static;background:' + col + '1A;color:' + col + '">当前</span>' : '') +
         '</div>';
    h += '<div style="font-size:11.5px;color:#9A9A9A;margin-top:3px">' +
         (at ? new Date(at).toLocaleString('zh-CN') : '—') + '</div>';
    h += '</div></div>';
  });
  h += '</div>';

  // P2-一：派单信息（受理人 + 预计完成时间）
  if(t.assignee || t.eta){
    h += '<div class="sect-t">派单信息</div><div class="form">' +
         '<div class="fitem"><div style="flex:0 0 88px;font-size:13px;color:#666">受理人</div>' +
         '<div style="flex:1;text-align:right;font-size:13.5px;font-weight:500">' + esc(t.assignee || '待分配') + '</div></div>' +
         '<div class="fitem"><div style="flex:0 0 88px;font-size:13px;color:#666">预计完成</div>' +
         '<div style="flex:1;text-align:right;font-size:13.5px;color:#333">' + esc(t.eta || '—') + '</div></div>' +
         '</div>';
  }

  // 工单信息
  h += '<div class="sect-t">工单信息</div><div class="form">';
  h += '<div class="fitem"><div style="flex:0 0 88px;font-size:13px;color:#666">工单类型</div>' +
       '<div style="flex:1;text-align:right;font-size:13.5px">' + esc(rec.title || rec.cat || '') + '</div></div>';
  if(rec.summary) h += '<div class="fitem"><div style="flex:0 0 88px;font-size:13px;color:#666">内容</div>' +
       '<div style="flex:1;text-align:right;font-size:12.5px;color:#333">' + esc(rec.summary) + '</div></div>';
  h += '<div class="fitem"><div style="flex:0 0 88px;font-size:13px;color:#666">提交人</div>' +
       '<div style="flex:1;text-align:right;font-size:13.5px">' + esc(rec.user || '') +
       (rec.dept ? '（' + esc(rec.dept) + '）' : '') + '</div></div>';
  h += '</div>';

  // P2-二/九：评价区（仅已完成 + 未评价过）
  h += renderTicketReviewSection(ticketId, t);

  // 演示用：手动推进状态
  if(t.state !== 'done'){
    h += '<div style="padding:2px 0 6px"><button onclick="doAdvanceTicket(\'' + kind + '\',\'' + ticketId + '\')" ' +
         'class="submit ghost" style="width:calc(100% - 28px);margin:10px 14px">模拟推进到下一状态</button></div>';
  }
  h += '<div class="copyright">状态流转：已提交 → 已接单 → 处理中 → 已完成</div>';
  h += '</div>';
  screen.innerHTML = h;
}

function doAdvanceTicket(kind, id){
  var r = TicketLog.advance(id);
  if(!r.ok){ toast(r.msg); return; }
  toast('状态已更新：' + TicketLog.label(r.to));
  setTimeout(function(){ render(); }, 900);
}

// P2-二：星级评价组件（1-5 星 + 可选文字）；P2-九：已评价不再显示入口
function renderTicketReviewSection(ticketId, t){
  var h = '';
  if(t.rated){
    h += '<div class="sect-t">我的评价</div><div class="form" style="padding:15px">';
    h += '<div style="font-size:20px;color:#C9A227;letter-spacing:3px">' +
         '★'.repeat(t.rating) + '<span style="color:#E0E0E0">' + '★'.repeat(5 - t.rating) + '</span></div>';
    if(t.review) h += '<div style="font-size:12.5px;color:#555;line-height:1.7;margin-top:9px;' +
         'background:#F8F8F8;border-radius:7px;padding:9px 11px">' + esc(t.review) + '</div>';
    h += '<div style="font-size:11px;color:#9A9A9A;margin-top:9px">评价于 ' +
         new Date(t.ratedAt).toLocaleString('zh-CN') + ' · 已评价，不可重复评价</div>';
    h += '</div>';
    return h;
  }
  if(t.state !== 'done'){
    h += '<div class="tip info"><span class="ti">ℹ️</span><div>工单完成（当前为「' +
         esc(TicketLog.label(t.state)) + '」）后可进行评价。</div></div>';
    return h;
  }
  // 已完成且未评价 -> 显示评价入口
  h += '<div class="sect-t">服务评价</div><div class="form" style="padding:15px">';
  h += '<div style="font-size:13px;color:#333;margin-bottom:10px">请对本次维修服务打分</div>';
  h += '<div style="display:flex;gap:9px;justify-content:center" id="tstars_' + ticketId + '">';
  for(var i = 1; i <= 5; i++){
    h += '<span onclick="setTicketStar(\'' + ticketId + '\',' + i + ')" id="tstar_' + ticketId + '_' + i + '" ' +
         'style="font-size:32px;cursor:pointer;color:#DDD;transition:color .15s;line-height:1">★</span>';
  }
  h += '</div>';
  h += '<div style="text-align:center;font-size:11.5px;color:#9A9A9A;margin-top:7px" id="thint_' + ticketId + '">点击星星评分</div>';
  h += '<textarea id="treview_' + ticketId + '" rows="3" placeholder="补充说明（选填）" ' +
       'style="width:100%;margin-top:13px;padding:10px;border:1px solid #E8E8E8;border-radius:8px;' +
       'font-size:13px;resize:none;outline:none;font-family:inherit;background:#F7F7F9"></textarea>';
  h += '<button onclick="submitTicketReview(\'' + ticketId + '\')" class="submit" ' +
       'style="width:100%;margin:13px 0 0;box-shadow:none">提交评价</button>';
  h += '<div id="trmsg_' + ticketId + '" style="font-size:12px;text-align:center;margin-top:9px;display:none"></div>';
  h += '</div>';
  return h;
}

var _ticketStars = {};
function setTicketStar(ticketId, n){
  _ticketStars[ticketId] = n;
  for(var i = 1; i <= 5; i++){
    var el = document.getElementById('tstar_' + ticketId + '_' + i);
    if(el) el.style.color = i <= n ? '#C9A227' : '#DDD';
  }
  var hint = document.getElementById('thint_' + ticketId);

// 指标：今日新增工单数 / 待处理数 / 已完成数 / 平均处理时长
function boardStats(){
  var todayStr = (function(){
    var d = new Date(), p = n => (n < 10 ? '0' : '') + n;
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  })();

  var tickets = [];
  ['repairs', 'applies'].forEach(function(k){
    (STORE.list(k) || []).forEach(function(r){
      var c = Object.assign({}, r);
      c._kind = k;
      if(isTicket(c)) tickets.push(c);
    });
  });

  // 演示兜底：若本地还没有工单，用看板基数，保证管理端看板有内容
  var base = { today: 8, pending: 5, done: 12, avgHours: 3.6 };
  var todayNew = 0, pending = 0, done = 0, durations = [];

  tickets.forEach(function(r){
    var st = TicketLog.get(r.id);
    var created = (r.createdStr || '').slice(0, 10);
    if(created === todayStr || !created) todayNew++;
    if(st !== 'done') pending++;
    if(st === 'done') done++;
    var d = TicketLog.detail(r.id);
    if(d && d.state === 'done'){
      var t0 = (d.history && d.history[0] && d.history[0].at) || 0;
      var t1 = (d.history && d.history[d.history.length - 1] && d.history[d.history.length - 1].at) || 0;
      if(t1 > t0) durations.push((t1 - t0) / 3600000);
    }
  });

  var avg = durations.length
    ? Math.round((durations.reduce(function(a, b){ return a + b; }, 0) / durations.length) * 10) / 10
    : base.avgHours;

  return {
    today: todayNew > 0 ? todayNew : base.today,
    pending: pending > 0 ? pending : base.pending,
    done: done > 0 ? done : base.done,
    avgHours: avg
  };
}

// ============ P0-2: 取餐核销码 ============
function genPickupCode() {
    // P2-6：生成 6 位数字核销码（100000-999999）
    var used = JSON.parse(localStorage.getItem('icbc_used_codes') || '[]');
    var code;
    var guard = 0;
    do {
        code = Math.floor(100000 + Math.random() * 900000);
        guard++;
    } while (used.includes(code) && guard < 500);
    used.push(code);
    // 只保留最近100个，防止无限增长
    if (used.length > 100) used = used.slice(-100);
    localStorage.setItem('icbc_used_codes', JSON.stringify(used));
    return code;
}

function getOrderPickupCode(orderId) {
    var order = p2GetOrder(orderId);
    return order ? order.pickup_code : null;
}

function fulfillOrder(orderId, code) {
    // P2 修复：核销改为在 STORE 上操作（与订单详情/列表同源）
    var order = p2GetOrder(orderId);
    if (!order) return { ok: false, msg: '订单不存在' };
    var allowed = ['submitted','under_review','approved'];
    if (allowed.indexOf(order.status) < 0) return { ok: false, msg: '订单状态不支持核销' };
    if (String(order.pickup_code) !== String(code)) return { ok: false, msg: '核销码错误' };

    order.status = 'fulfilled';
    order.fulfilled_at = Date.now();
    STORE.save();
    return { ok: true, msg: '取餐成功' };
}

// ============ P0-1: 签约状态机 ============
const ORDER_STATES = {
    draft:       { name: '草稿',   color: '#999', next: ['submitted'] },
    submitted:   { name: '已提交', color: '#1E5AA8', next: ['under_review', 'cancelled'] },
    under_review:{ name: '审核中', color: '#B45309', next: ['approved', 'rejected'] },
    approved:    { name: '已通过', color: '#0F8A5F', next: ['fulfilled', 'cancelled'] },
    fulfilled:   { name: '已履约', color: '#6D4AA8', next: ['completed'] },
    completed:   { name: '已完成', color: '#0A6847', next: [] },
    rejected:    { name: '已拒绝', color: '#C7000B', next: [] },
    cancelled:   { name: '已取消', color: '#999', next: [] }
};

function canTransition(fromState, toState) {
    var state = ORDER_STATES[fromState];
    return state && state.next.includes(toState);
}

function transitionOrder(orderId, toState, by) {
    var orders = JSON.parse(localStorage.getItem('icbc_oa_orders') || '[]');
    var order = orders.find(function(o) { return o.id === orderId; });
    if (!order) return { ok: false, msg: '订单不存在' };
    if (!canTransition(order.status, toState)) {
        return { ok: false, msg: '非法状态流转: ' + order.status + ' → ' + toState };
    }
    
    var fromState = order.status;
    order.status = toState;
    order.status_history = order.status_history || [];
    order.status_history.push({
        from: fromState,
        to: toState,
        at: Date.now(),
        by: by || 'system'
    });
    
    // P0-2: 如果进入 approved 状态，生成核销码
    if (toState === 'approved' && !order.pickup_code) {
        order.pickup_code = genPickupCode();
    }
    
    localStorage.setItem('icbc_oa_orders', JSON.stringify(orders));
    return { ok: true, msg: '状态已更新', from: fromState, to: toState };
}

function getStateBadge(status) {
    var state = ORDER_STATES[status];
    if (!state) return '<span class="tag gray">未知</span>';
    var style = 'background:' + state.color + '1A;color:' + state.color;
    return '<span class="tag" style="' + style + '">' + state.name + '</span>';
}

function renderStateTimeline(order) {

    h += '</div></div>';

function renderOrderActions(order) {

    // 根据状态显示操作按钮
    if (status === 'submitted') {

        h += '拒绝原因: ' + (order.reject_reason || '未填写') + '</div>';
    }
    
    return h;

function doTransition(orderId, toState, by) {
    var result = transitionOrder(orderId, toState, by);
    if (result.ok) {
        toast('状态已更新: ' + ORDER_STATES[result.from].name + ' → ' + ORDER_STATES[result.to].name);
        setTimeout(function() { render(); }, 1000);
    } else {
        toast(result.msg);
    }
}

// ============ P0-3: 评价限制（48小时+已取餐） ============
const REVIEW_WINDOW_HOURS = 48;

function getReviewHoursLeft(order) {
    if (!order.fulfilled_at) return 0;
    var elapsed = Date.now() - order.fulfilled_at;
    var hoursLeft = REVIEW_WINDOW_HOURS - (elapsed / (1000 * 60 * 60));
    return Math.max(0, Math.floor(hoursLeft));
}

function canReview(order) {
    // 只有已履约的订单才能评价
    if (order.status !== 'fulfilled') return false;
    // 48小时内
    return getReviewHoursLeft(order) > 0;
}

function submitReview(orderId, rating, reviewText) {
    var orders = JSON.parse(localStorage.getItem('icbc_oa_orders') || '[]');
    var order = orders.find(function(o) { return o.id === orderId; });
    if (!order) return { ok: false, msg: '订单不存在' };
    if (!canReview(order)) return { ok: false, msg: '无法评价（已超时或状态不正确）' };
    if (order.rating) return { ok: false, msg: '已评价过，不能重复评价' };
    
    order.rating = rating;
    order.review = reviewText || '';
    order.reviewed_at = Date.now();
    order.status = 'completed';
    order.status_history = order.status_history || [];
    order.status_history.push({
        from: 'fulfilled',
        to: 'completed',
        at: Date.now(),
        by: 'user',
        note: '提交评价'
    });
    
    localStorage.setItem('icbc_oa_orders', JSON.stringify(orders));
    return { ok: true, msg: '评价成功' };
}

        msg.textContent = '✓ ' + result.msg;

        msg.style.color = '#C7000B';
        msg.textContent = '✗ ' + result.msg;

}

function renderReviewSection(order) {

    // 已评价 - 显示评价内容
    if (order.status === 'completed' && order.rating) {
        h += '<div style="margin:14px;padding:16px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)">';
        h += '<div style="font-size:13px;font-weight:600;margin-bottom:10px;color:#333">我的评价</div>';
        h += '<div style="font-size:18px;color:#C9A227;margin-bottom:8px;letter-spacing:2px">' + 
             '★'.repeat(order.rating) + '<span style="color:#DDD">' + '★'.repeat(5 - order.rating) + '</span></div>';
        if (order.review) {
            h += '<div style="font-size:13px;color:#666;line-height:1.6;padding:10px;background:#F8F8F8;border-radius:6px">' + 
                 esc(order.review) + '</div>';
        }
        h += '<div style="font-size:11px;color:#999;margin-top:10px">评价于 ' + 
             new Date(order.reviewed_at).toLocaleString('zh-CN') + '</div>';
        h += '</div>';
    }
    
    // 未评价 - 显示评价入口
    if (order.status === 'fulfilled') {
        var hoursLeft = getReviewHoursLeft(order);
        if (hoursLeft > 0) {
            h += '<button onclick="openReview(\'' + order.id + '\')" ' +
                 'style="width:calc(100% - 28px);margin:14px;padding:13px;background:#C7000B;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">' +
                 '评价订单（剩余 ' + hoursLeft + ' 小时）</button>';
            h += renderReviewForm(order);
        } else {
            h += '<div style="margin:14px;padding:12px;background:#F5F5F5;border-radius:8px;text-align:center;color:#999;font-size:13px">' +
                 '订单已超时（超过48小时），无法评价</div>';
        }
    }
    
    return h;
}

let VISITOR_INVITE = null;

// 邀请码规则：IV-YYYYMMDD-###
function nextInviteCode(){
  var d = new Date(), p = n => (n < 10 ? '0' : '') + n;
  var ymd = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
  var seq = {};
  try{ seq = JSON.parse(localStorage.getItem('icbc_p3_invite_seq') || '{}'); }catch(e){ seq = {}; }
  seq[ymd] = (seq[ymd] || 0) + 1;
  try{ localStorage.setItem('icbc_p3_invite_seq', JSON.stringify(seq)); }catch(e){}
  var n = seq[ymd];
  return 'IV-' + ymd + '-' + (n < 10 ? '00' : (n < 100 ? '0' : '')) + n;
}
