<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苏州楼市 · 月度视角</title>
<script>
/* ECharts 多CDN动态加载+自动回退（与家庭导航其他看板一致） */
(function(){
  var CDNS = {
    'npmmirror': 'https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js',
    'bootcdn':   'https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js',
    'unpkg':     'https://unpkg.com/echarts@5.5.0/dist/echarts.min.js',
    'jsdelivr':  'https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js',
    'staticfile': 'https://cdn.staticfile.org/echarts/5.5.0/echarts.min.js'
  };
  var keys = Object.keys(CDNS);
  function tryLoad(i, cb){
    if(i >= keys.length){ cb(false); return; }
    var k = keys[i];
    if(window.echarts){ cb(true); return; }
    var s = document.createElement('script');
    s.src = CDNS[k];
    s.onload = function(){ cb(true); };
    s.onerror = function(){ s.remove(); tryLoad(i+1, cb); };
    document.head.appendChild(s);
  }
  window.__loadECharts = function(cb){ tryLoad(0, cb); };
})();
</script>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --border:#e8edf2; --text:#1f2d3d; --muted:#8a97a8;
  --brand:#00ae66; --brand-d:#00925a; --blue:#2b7de9; --red:#e8463a; --green:#00ae66;
  --shadow:0 2px 10px rgba(31,45,61,.06);
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
  background:var(--bg); color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  padding:14px 14px 40px; line-height:1.5;
}
.wrap{ max-width:920px; margin:0 auto; }
.topbar{
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);
  color:#fff; border-radius:14px; padding:16px 18px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
}
.topbar .t1{ font-size:20px; font-weight:700; display:flex; align-items:center; gap:8px; }
.topbar .t2{ font-size:12px; opacity:.92; margin-top:3px; }
.topbar .tag{ background:rgba(255,255,255,.2); border-radius:20px; padding:3px 10px; font-size:11px; }
.grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow:var(--shadow); }
.card .lab{ font-size:12px; color:var(--muted); }
.card .val{ font-size:26px; font-weight:700; margin-top:4px; }
.card .sub{ font-size:12px; margin-top:4px; color:var(--muted); }
.card .sub b{ font-weight:700; }
.up{ color:var(--red); }   /* 涨=红 */
.down{ color:var(--green); } /* 跌=绿 */
.flat{ color:var(--muted); }
.sec{ margin-top:18px; }
.sec h2{ font-size:16px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.sec h2::before{ content:""; width:4px; height:16px; background:var(--brand); border-radius:2px; display:inline-block; }
.chart{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px; box-shadow:var(--shadow); }
.chart .ct{ font-size:13px; color:var(--muted); padding:2px 4px 6px; }
.tbl{ width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); font-size:12.5px; }
.tbl thead th{ background:#eef5f1; color:#1f2d3d; font-weight:600; padding:9px 6px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--border); }
.tbl thead th:first-child{ text-align:left; }
.tbl tbody td{ padding:9px 6px; text-align:right; border-bottom:1px solid #f0f3f6; white-space:nowrap; }
.tbl tbody td:first-child{ text-align:left; font-weight:600; }
.tbl tbody tr:last-child td{ border-bottom:none; }
.tbl tbody tr:nth-child(even){ background:#fafcfe; }
.note{ margin-top:18px; background:#fff8e8; border:1px solid #ffe2a8; border-radius:10px; padding:12px 14px; font-size:12px; color:#8a6d2f; }
.note b{ color:#7a5e22; }
.empty{ text-align:center; color:var(--muted); padding:40px; }
footer{ text-align:center; color:var(--muted); font-size:11px; margin-top:20px; }
@media(max-width:560px){
  .grid{ grid-template-columns:repeat(2,1fr); }
  .card .val{ font-size:22px; }
  .tbl{ font-size:11px; }
  .tbl thead th,.tbl tbody td{ padding:7px 4px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="t1">📅 苏州楼市 · 月度视角</div>
      <div class="t2" id="upd">加载中…</div>
    </div>
    <div class="topact">
      <span class="tag">周报按月归并 · 上月 vs 本月</span>
    </div>
  </div>

  <div id="content">
    <div class="empty">正在读取苏州楼市数据…</div>
  </div>

  <footer>数据来源：网易「楼市周报」+ 中指院「苏州房地产市场周报」 · 家庭导航看板<br>月度数据由每周周报<b>按月归并</b>得到，环比为上月 vs 本月</footer>
</div>

<script src="suzhou_property.js?v=20261113"></script>
<script>
(function(){
  var D = window.SUZHOU_PROPERTY;
  var C = document.getElementById('content');
  if(!D){
    C.innerHTML = '<div class="empty">未找到数据文件 suzhou_property.js</div>';
    document.getElementById('upd').textContent = '数据缺失';
    return;
  }
  document.getElementById('upd').textContent = '最近更新：' + (D.updated_at||'—') + (D.note? '　·　'+D.note : '');

  var weekly = (D.weekly||[]).slice();

  function pct(v){ var n=parseFloat(v); return isNaN(n)? null : n; }
  function fmtPct(v){
    var n=pct(v); if(n===null) return '—';
    var s=(n>0?'+':'')+n.toFixed(2)+'%';
    var cls=n>0?'up':(n<0?'down':'flat');
    return '<span class="'+cls+'">'+s+'</span>';
  }
  function num(v){ var n=parseFloat(v); return isNaN(n)? '—' : n.toLocaleString('zh-CN'); }

  // ===== 客户端按月归并 =====
  function aggregateMonthly(weekly){
    if(!weekly || !weekly.length) return [];
    var baseYear = new Date().getFullYear();
    function parseRange(w){
      var m=/\((\d{1,2})\/(\d{1,2})-(\d{1,2})\/(\d{1,2})\)/.exec(w||'');
      if(!m) return null;
      return [+m[1],+m[2],+m[3],+m[4]];
    }
    var buckets={}, order=[];
    weekly.forEach(function(wk){
      var r=parseRange(wk.week); if(!r) return;
      var m1=r[0],m2=r[2];
      var y2=baseYear; if(m2<m1) y2=baseYear+1;
      var key=y2+'-'+('0'+m2).slice(-2);
      if(!buckets[key]){ buckets[key]={y:y2,m:m2,recs:[]}; order.push(key); }
      buckets[key].recs.push(wk);
    });
    var out=[], prev=null;
    order.forEach(function(k){
      var recs=buckets[k].recs, y=buckets[k].y, m=buckets[k].m;
      function sum(key){ return recs.reduce(function(a,x){ return a+(x[key]!=null?x[key]:0); },0); }
      function avg(key){ var vs=recs.filter(function(x){return x[key]!=null;}).map(function(x){return x[key];}); return vs.length? Math.round(vs.reduce(function(a,b){return a+b;},0)/vs.length*10)/10 : null; }
      var nh=sum('new_home'), sh=sum('second_hand');
      var cur={month:k, label:y+'年'+m+'月', new_home:nh, second_hand:sh,
        new_area:Math.round(sum('new_area')*100)/100, second_area:Math.round(sum('second_area')*100)/100,
        new_avg:avg('new_avg'), second_avg:avg('second_avg'), weeks:recs.length,
        partial:recs.length<4, new_mom:null, second_mom:null, new_yoy:null, second_yoy:null};
      if(prev){
        if(prev.new_home) cur.new_mom=Math.round((nh-prev.new_home)/prev.new_home*100*100)/100;
        if(prev.second_hand) cur.second_mom=Math.round((sh-prev.second_hand)/prev.second_hand*100*100)/100;
      }
      out.push(cur); prev=cur;
    });
    return out;
  }

  function card(lab,val,sub){
    return '<div class="card"><div class="lab">'+lab+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>';
  }

  var monthly = aggregateMonthly(weekly);

  if(!monthly.length){
    C.innerHTML = '<div class="empty">暂无足够周数据以生成月度视角（需至少跨周）</div>';
    return;
  }

  var lastM = monthly[monthly.length-1];
  var prevM = monthly.length>1 ? monthly[monthly.length-2] : null;
  var pTag = function(x){ return x && x.partial ? ' <span style="color:#b5811f;font-weight:400">·不满月</span>' : ''; };

  // 摘要卡片：本月 vs 上月
  var mCards = '';
  mCards += card('本月·新房成交(合计)', num(lastM.new_home)+'<span style="font-size:13px;color:var(--muted)"> 套</span>', '环比 '+fmtPct(lastM.new_mom)+(lastM.partial?' <span style="color:#b5811f">·周数不足</span>':''));
  mCards += card('本月·二手成交(合计)', num(lastM.second_hand)+'<span style="font-size:13px;color:var(--muted)"> 套</span>', '环比 '+fmtPct(lastM.second_mom)+(lastM.partial?' <span style="color:#b5811f">·周数不足</span>':''));
  mCards += card('本月·新房日均', num(lastM.new_avg)+'<span style="font-size:13px;color:var(--muted)"> 套/日</span>', '面积合计 '+num(lastM.new_area)+' 万㎡');
  mCards += card('本月·二手日均', num(lastM.second_avg)+'<span style="font-size:13px;color:var(--muted)"> 套/日</span>', '面积合计 '+num(lastM.second_area)+' 万㎡');
  if(prevM){
    mCards += card('上月·新房成交', num(prevM.new_home)+'<span style="font-size:13px;color:var(--muted)"> 套</span>', prevM.label+'（'+prevM.weeks+'周）');
    mCards += card('上月·二手成交', num(prevM.second_hand)+'<span style="font-size:13px;color:var(--muted)"> 套</span>', prevM.label+'（'+prevM.weeks+'周）');
  }

  // 月度趋势图
  var monthLabels = monthly.map(function(x){return x.label;});
  var mTrend =
    '<div class="sec"><h2>月度成交量汇总（周报归并）</h2>'+
    '<div class="chart"><div class="ct">新房 vs 二手 · 月度成交合计（套）</div><div id="chartMonth" style="width:100%;height:260px;"></div></div>'+
    '</div>';

  // 月度表
  var mrows = monthly.map(function(x){
    return '<tr>'+
      '<td>'+x.label+pTag(x)+'</td>'+
      '<td>'+num(x.new_home)+'</td>'+
      '<td>'+fmtPct(x.new_mom)+'</td>'+
      '<td>'+num(x.new_avg)+'</td>'+
      '<td>'+num(x.new_area)+'</td>'+
      '<td>'+num(x.second_hand)+'</td>'+
      '<td>'+fmtPct(x.second_mom)+'</td>'+
      '<td>'+num(x.second_avg)+'</td>'+
      '<td>'+num(x.second_area)+'</td>'+
      '<td style="color:var(--muted)">'+x.weeks+'</td>'+
    '</tr>';
  }).join('');
  var mTable =
    '<div class="sec"><h2>月度成交分析表</h2>'+
    '<div style="overflow-x:auto;"><table class="tbl"><thead><tr>'+
      '<th>月份</th><th>新房(套)</th><th>新房环比</th><th>新房日均</th><th>新房面积(万㎡)</th>'+
      '<th>二手(套)</th><th>二手环比</th><th>二手日均</th><th>二手面积(万㎡)</th><th>周数</th>'+
    '</tr></thead><tbody>'+mrows+'</tbody></table></div>'+
    '<div class="note" style="margin-top:10px;">月度数据由每周周报<b>按月归并</b>：成交合计=当月各周之和，日均=各周日均均值，环比=本月合计 vs 上月合计。'+
    '<b>标「不满月」的月份周数不足，环比非完整月对比，仅作趋势参考</b>；同比需满 12 个月历史后补充。</div></div>';

  // 周度明细（参考）
  var wrows = weekly.map(function(x){
    return '<tr>'+
      '<td>'+x.week+'</td>'+
      '<td>'+num(x.new_home)+'</td>'+
      '<td>'+fmtPct(x.new_qoq)+'</td>'+
      '<td>'+fmtPct(x.new_yoy)+'</td>'+
      '<td>'+num(x.new_avg)+'</td>'+
      '<td>'+num(x.new_area)+'</td>'+
      '<td>'+num(x.second_hand)+'</td>'+
      '<td>'+fmtPct(x.second_qoq)+'</td>'+
      '<td>'+fmtPct(x.second_yoy)+'</td>'+
      '<td>'+num(x.second_avg)+'</td>'+
      '<td>'+num(x.second_area)+'</td>'+
    '</tr>';
  }).join('');
  var wTable =
    '<div class="sec"><h2>周度明细（归并来源）</h2>'+
    '<div style="overflow-x:auto;"><table class="tbl"><thead><tr>'+
      '<th>统计周</th><th>新房(套)</th><th>新房环比</th><th>新房同比</th><th>新房日均</th><th>新房面积(万㎡)</th>'+
      '<th>二手(套)</th><th>二手环比</th><th>二手同比</th><th>二手日均</th><th>二手面积(万㎡)</th>'+
    '</tr></thead><tbody>'+wrows+'</tbody></table></div></div>';

  C.innerHTML =
    '<div class="sec"><h2>📅 月度视角（上月 vs 本月）</h2><div class="grid">'+mCards+'</div></div>'+
    mTrend + mTable + wTable +
    '<div class="note"><b>口径说明：</b>周报为「住宅」口径，含苏州市区六区；月度由周报按月归并，环比为上月vs本月。'+
    '单日播报为公众号裸数字，与周报口径不同。'+(D.note? '<br>'+D.note : '')+'</div>';

  // 渲染图表
  window.__loadECharts(function(ok){
    if(!ok) return;
    var mcht = echarts.init(document.getElementById('chartMonth'));
    mcht.setOption({
      tooltip:{trigger:'axis'},
      legend:{data:['新房','二手'],top:0,textStyle:{color:'#1f2d3d'}},
      grid:{left:8,right:16,top:34,bottom:24,containLabel:true},
      xAxis:{type:'category',data:monthLabels,axisLabel:{color:'#8a97a8',interval:0},axisLine:{lineStyle:{color:'#e8edf2'}}},
      yAxis:{type:'value',axisLabel:{color:'#8a97a8'},splitLine:{lineStyle:{color:'#f0f3f6'}}},
      series:[
        {name:'新房',type:'bar',data:monthly.map(function(x){return x.new_home;}),itemStyle:{color:'#2b7de9',borderRadius:[4,4,0,0]},barMaxWidth:40},
        {name:'二手',type:'bar',data:monthly.map(function(x){return x.second_hand;}),itemStyle:{color:'#00ae66',borderRadius:[4,4,0,0]},barMaxWidth:40}
      ]
    });
    window.addEventListener('resize',function(){ if(mcht) mcht.resize(); });
  });
})();
</script>
</body>
</html>
